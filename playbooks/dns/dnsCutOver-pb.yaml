##############################################################################
# Cut the DNS server over from the imager IP to its final static IP
#
# USAGE:
#   Moves an already-provisioned DNS server host off its imager /
#   post-install address (typically 192.168.129.1, from
#   data/network/staticIP/installer.yaml) onto its final address from
#   data/network/staticIP/dns.yaml (192.168.2.17). NetworkManager
#   handles the live switch via a fresh .nmconnection file.
#
#   Idempotent: if the host is already on the target address (dns.yaml
#   `ipDetails.address`), setStaticIP's online strategy short-circuits
#   and Play 2 is a no-op.
#
# EXAMPLE:
#   ansible-playbook --extra-vars "nodes=dns" playbooks/dns/dnsCutOver-pb.yaml
#
# WORKFLOW:
#   Play 1 (localhost):
#     1. bootstrap: Standard project bootstrap
#     2. getTargetHostIP: Resolve the DNS host's current IP -- try the
#        inventory address first, prompt (niceInput) if unreachable
#     3. prepareRemoteCredentials: Load builder user credentials
#     4. post_task: Load dns.yaml `ipDetails.address` as `targetIP` on
#        localhost so Play 2 can gate on it
#   Play 2 (target - as builder):
#     5. setStaticIP: Online strategy against
#        data/network/staticIP/dns.yaml. Writes eth0-manual.nmconnection
#        and switches the live NM connection; waits for SSH on the new
#        address. Skipped if _currentIP == _targetIP.
#   Play 3 (localhost):
#     6. clearLocal: Remove materialized SSH keys
#
# PREREQUISITES:
#   - DNS host already provisioned (bind9, dhcpd, pi-hole, etc.
#     installed via buildDNSServer-pb.yaml)
#   - Builder user exists on the target with valid SSH credentials
#   - data/network/staticIP/dns.yaml populated with the target
#     ipDetails (address, netmask, gateway, dns, domain)
#   - The target address (.2.17) is not currently in use by another
#     host on the LAN
#
# NOTES:
#   - Cutover is one-way in the sense that after Play 2, subsequent
#     runs of this playbook find the host already at the target IP
#     and skip the switch (idempotent).
#   - No service reconfiguration is required on the DNS server: bind9
#     and dhcpd listen on 0.0.0.0 / all interfaces, so they follow the
#     new address automatically.
#   - Any stale DHCP lease for the imager address on the DHCP server
#     should be released or purged separately -- out of scope here.
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.0
# Date: September 12, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Play 1: Resolve target host IP and load builder credentials (localhost)
# Note: Vault decryption works on localhost (task-level include_vars)
##############################################################################
- name: Load builder credentials and resolve DNS host
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: bootstrap
    - role: getTargetHostIP
      vars:
        targetHost: "{{ groups[nodes | default('dns')] | first }}"
    - role: prepareRemoteCredentials
      vars:
        userDataPath: "{{ dataPath }}/users/{{ builderUser }}/user.yaml"

  post_tasks:
    # Load the DNS host's target static IP into a localhost fact so Play 2
    # can gate on it (and skip entirely when the host is already there).
    - name: Load target static IP for gating Play 2
      ansible.builtin.set_fact:
        targetIP: "{{ (lookup('file', dataPath ~ '/network/staticIP/dns.yaml') | from_yaml).ipDetails.address }}"

##############################################################################
# Play 2: Cut DNS host over from current IP to dns.yaml target IP.
#
# Skip condition (role-level `when:` on setStaticIP):
#   _currentIP != _targetIP
#     - _currentIP: where getTargetHostIP found the host reachable
#                   (localhost fact currentIP, aliased)
#     - _targetIP:  where dns.yaml says the DNS host should live
#                   (localhost fact targetIP, aliased)
#   Equal → setStaticIP's tasks all skip. Different → setStaticIP runs
#   and switches the host onto the target address.
##############################################################################
- name: Cut DNS host over to final static IP
  hosts:        "{{ _currentIP }}"
  become:       true
  gather_facts: false

  # Load remote connection vars (connectionKey.yaml or connectionPWD.yaml)
  vars_files:
    - "{{ pbPath }}/vars/connection{{ hostvars['localhost'].userData.file }}.yaml"

  roles:
    - role: setStaticIP
      when: _currentIP != _targetIP
      vars:
        currentAddress:   "{{ _currentIP }}"
        staticIPDataPath: "{{ dataPath }}/network/staticIP/dns.yaml"

  vars:
    _currentIP: "{{ hostvars['localhost'].currentIP }}"
    _targetIP:  "{{ hostvars['localhost'].targetIP }}"

##############################################################################
# Play 3: Cleanup materialized SSH keys on the controller
##############################################################################
- name: Cleanup materialized SSH keys
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - clearLocal
