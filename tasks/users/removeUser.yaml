##############################################################################
# Remove a single user account from a vault-encrypted user.yaml file
#
# USAGE:
#   Loads user data from a single user.yaml path and removes the account
#   (and home directory) from the target host. Singular form — see
#   removeUsers.yaml for the plural (directory-scan) wrapper.
#
# REQUIRED VARIABLES:
#   - userDataPath: Path to vault-encrypted user.yaml file containing a
#                   userData dict with at minimum: uName
#
# OPTIONAL VARIABLES:
#   - debugFlag: Enable debug output
#
# WORKFLOW:
#   1. Validate userDataPath is provided
#   2. Load user data from userDataPath (vault decrypted via include_vars)
#   3. Kill all processes owned by the user (errors ignored)
#   4. Remove user account and home directory
#
# EXAMPLE:
#   - name: Remove installer user
#     include_tasks:
#       file: "{{ taskDir }}/users/removeUser.yaml"
#     vars:
#       userDataPath: "{{ dataDir }}/users/installer/user.yaml"
#
# NOTES:
#   - Errors from killall are ignored (user may not exist or have no
#     processes)
#   - User's home directory is removed with the account
#   - Process termination uses signal 9 (SIGKILL)
#   - Idempotent: safe to run even if the user does not exist
#   - | trim applied to uName to strip trailing newlines that
#     ansible-vault encrypt_string appends to decrypted values
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: April 25, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Validate required parameter
##############################################################################
- name: Validate userDataPath is provided
  ansible.builtin.fail:
    msg: "[ERROR] *** userDataPath is required for removeUser task"
  when: userDataPath is not defined

##############################################################################
# Load user data from vault-encrypted file
##############################################################################
- name: Load user data
  ansible.builtin.include_vars:
    file: "{{ userDataPath }}"
    name: _ruLoadedUser

##############################################################################
# Kill all processes owned by user before removing
##############################################################################
- name: "Kill processes for user [{{ _ruLoadedUser.userData.uName | trim }}]"
  ansible.builtin.command:
    cmd: "killall -9 -u {{ _ruLoadedUser.userData.uName | trim }}"
  ignore_errors: true
  register: _killProcessesResult

##############################################################################
# Remove user account and home directory
##############################################################################
- name: "Remove user account [{{ _ruLoadedUser.userData.uName | trim }}]"
  ansible.builtin.user:
    name:   "{{ _ruLoadedUser.userData.uName | trim }}"
    remove: true
    state:  absent