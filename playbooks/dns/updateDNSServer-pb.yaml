##############################################################################
# Update an already-provisioned DNS server
#
# Pushes fresh DNS / DHCP / pi-hole configuration to a host where
# bind9, isc-dhcp-server, and pi-hole are already installed. Use this
# whenever data/network/inventory.xlsx changes (new host, IP shuffle,
# MAC update, etc.) or when per-package metadata changes -- no
# reinstall, no service restart unless a config file actually changed.
#
# PREREQUISITES:
#   - The target DNS server already provisioned via
#     playbooks/buildDNSServer-pb.yaml
#   - Target reachable on the network at the inventory address
#
# DIFFERENCE FROM buildDNSServer-pb.yaml:
#   buildDNSServer-pb.yaml installs base packages, sets up users, and
#   then configures. This playbook skips install entirely and runs
#   only the configure phase of bind9, isc-dhcp-server, and pi-hole.
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.0
# Date: May 16, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Play 1: Load credentials on the controller
##############################################################################
- name: Prepare local resources
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: prepareRemoteCredentials
      vars:
        userDataPath: "{{ dataPath }}/users/dwfa/user.yaml"

##############################################################################
# Play 2: Push fresh config to the target host
##############################################################################
- name: Reconfigure DNS server services
  hosts:        "{{ nodes }}"
  become:       true
  gather_facts: true

  # Load remote connection vars (connectionKey.yaml or connectionPWD.yaml)
  vars_files:
    - "{{ pbPath }}/vars/connection{{ hostvars['localhost'].userData.file }}.yaml"

  roles:
    - role: reconfigureDNSServer

##############################################################################
# Play 3: Cleanup materialized SSH keys on the controller
##############################################################################
- name: Cleanup materialized SSH keys
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - clearLocal