##############################################################################
# Configure isc-dhcp-server: render /etc/dhcp/dhcpd.conf + the
# /etc/default/isc-dhcp-server file from the canonical inventory.
#
# USAGE:
#   Auto-discovered by installPackages when `isc-dhcp-server` is in the
#   packageList. Loads dhcp-specific metadata, parses the network
#   inventory via netGen, renders Jinja2 templates, validates with
#   `dhcpd -t`, then enables + restarts the service.
#
# REQUIRED VARIABLES:
#   None at the call site. Driven by:
#     - data/packages/isc-dhcp-server/metadata.yaml
#     - data/network/inventory.xlsx (via netGen)
#
# OPTIONAL VARIABLES:
#   - debugFlag: Enable debug output
#
# WORKFLOW:
#   1. Load dhcp metadata (lease times, guest pool, listen interface)
#   2. Parse network inventory via networkInventory module (delegated
#      to controller); --strict so data-quality issues fail fast
#   3. Render /etc/dhcp/dhcpd.conf from the template:
#         - global options use network.domain/dnsServer/gateway
#         - subnet declaration uses the /16 from metadata.subnets[0]
#         - host {} reservation blocks for each MAC of each
#           dhcpManaged host
#   4. Render /etc/default/isc-dhcp-server (listen interface)
#   5. Validate the rendered config with `dhcpd -t`
#   6. Enable + restart the service
#
# NOTES:
#   - Hosts whose comment contains "no dhcp" are skipped — they
#     self-configure their static IPs (wormhole, ds9, pihole today)
#   - `dhcpd -t` is run BEFORE restart so a bad config doesn't take
#     down the running daemon
#   - Loop variables follow the project's <noun>Idx convention where
#     applicable; Jinja2 inside the template handles host iteration
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.0
# Date: May 10, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Step 1: Load dhcp metadata
##############################################################################
- name: Load isc-dhcp-server configuration manifest
  ansible.builtin.include_vars:
    file: "{{ dataDir }}/packages/isc-dhcp-server/metadata.yaml"

##############################################################################
# Step 2: Parse the canonical network inventory on the controller.
# Shared task -- cached as `netInventory` for the play, so a multi-
# service run (bind9 + isc-dhcp + pi-hole) parses the Excel once.
##############################################################################
- name: Ensure network inventory is parsed
  ansible.builtin.include_tasks: "{{ taskDir }}/network/parseInventory.yaml"

##############################################################################
# Step 3: Render /etc/dhcp/dhcpd.conf
##############################################################################
- name: Render /etc/dhcp/dhcpd.conf
  ansible.builtin.template:
    src:    "{{ dataDir }}/packages/isc-dhcp-server/templates/dhcpd.conf.j2"
    dest:   /etc/dhcp/dhcpd.conf
    owner:  root
    group:  root
    mode:   '0644'
    backup: true
  vars:
    network:        "{{ netInventory.metadata.network }}"
    dhcpHosts:      "{{ netInventory.hosts }}"
    networkSubnet:  "{{ netInventory.metadata.subnets[0].subnetPrefix }}.0.0"

##############################################################################
# Step 4: Render /etc/default/isc-dhcp-server (sets listen interface)
##############################################################################
- name: Render /etc/default/isc-dhcp-server
  ansible.builtin.template:
    src:    "{{ dataDir }}/packages/isc-dhcp-server/templates/defaults.j2"
    dest:   /etc/default/isc-dhcp-server
    owner:  root
    group:  root
    mode:   '0644'
    backup: true

##############################################################################
# Step 5: Validate the rendered dhcpd.conf before letting the service load it
##############################################################################
- name: Validate dhcpd configuration
  ansible.builtin.command:
    cmd: dhcpd -t -cf /etc/dhcp/dhcpd.conf
  changed_when: false

##############################################################################
# Step 6: Enable + restart isc-dhcp-server
##############################################################################
- name: Enable and restart isc-dhcp-server
  ansible.builtin.systemd:
    name:    isc-dhcp-server
    enabled: true
    state:   restarted
