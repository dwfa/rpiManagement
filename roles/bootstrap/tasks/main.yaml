##############################################################################
# Controller-side prerequisite bootstrap
#
# Ensures Python modules required by downstream tasks are present in the
# Ansible controller's Python environment. Runs on localhost only.
#
# CURRENT REQUIREMENTS:
#   - passlib: needed by ansible.builtin.password_hash on Python 3.13+,
#     where the stdlib crypt module was removed (PEP 594).
#
# BEHAVIOR:
#   - Hard-fails if the controller Python interpreter is not inside a venv.
#     Avoids installing packages into system / Homebrew Python.
#   - Idempotent install of each required module (pip is a no-op when the
#     module is already present at any version).
#
# USAGE:
#   - roles:
#       - role: bootstrap    # first role in the localhost play
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.0
# Date: August 16, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Detect whether the controller interpreter is inside a virtual environment.
# `sys.prefix != sys.base_prefix` is the standard Python-level test and
# works for both venv and virtualenv.
##############################################################################
- name: Detect controller Python venv
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "import sys; print('yes' if sys.prefix != sys.base_prefix else 'no')"
  register: _venvCheck
  changed_when: false

- name: Refuse to bootstrap into non-venv interpreter
  ansible.builtin.fail:
    msg: >-
      [ERROR] *** Controller interpreter [{{ ansible_playbook_python }}]
      is not inside a virtual environment. Refusing to install packages
      system-wide. Launch via ar.py (which uses .venv/), or create and
      activate a venv before running ansible-playbook directly:
        python3 -m venv .venv && source .venv/bin/activate
  when: _venvCheck.stdout | trim != 'yes'

##############################################################################
# Install required Python modules into the controller venv.
# pip is idempotent: no-op when already present.
##############################################################################
- name: Ensure required Python modules are installed
  ansible.builtin.pip:
    name: "{{ item }}"
    executable: "{{ ansible_playbook_python | dirname }}/pip"
  loop:
    - passlib
