##############################################################################
# Ensure a TSIG key for the project's DNS domain exists at
# data/ddns/tsig/<domain>.tsig.key.yaml.
#
# Idempotent:
#   - First run:         invokes `tsig-keygen` on the controller to
#                        produce a fresh HMAC-SHA256 key; decomposes
#                        the output into { name, algorithm, secret };
#                        vault-encrypts the secret; writes YAML.
#   - Subsequent runs:   file present → no-op.
#
# REQUIRED VARIABLES:
#   - dataPath: absolute path to data/ (auto-loaded from group_vars/all.yaml)
#   - domain:   DNS zone the key protects (auto-loaded from group_vars/all.yaml)
#
# OPTIONAL VARIABLES:
#   - tsigKeyName:   short name for the TSIG key (default: "<domain>-ddns")
#   - tsigAlgorithm: HMAC algorithm (default: "hmac-sha256")
#
# OUTPUT FILES:
#   - {{ dataPath }}/ddns/tsig/{{ domain }}.tsig.key.yaml
#
# NOTES:
#   - Requires `tsig-keygen` on the controller — part of the bind9 or
#     bind9-utils package. Bootstrap does NOT install it (controller-
#     side; installed via brew/apt one-time by the user).
#   - The vault password file used to encrypt the secret is the same
#     one referenced by ansible.cfg's vault_password_file.
#   - CA-like rotation policy: not auto-rotated. To roll the key,
#     delete the .yaml file and re-run; every consumer (bind + dhcpd)
#     will pick up the new value on the next reconfigure.
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.0
# Date: September 09, 2026
##############################################################################
---                                                   # identifies a YAML file

- name: Ensure TSIG key exists
  block:

    - name: Check whether TSIG key file already exists
      ansible.builtin.stat:
        path: "{{ _tsigKeyFile }}"
      register: _tsigStat

    - name: Generate + persist TSIG key
      when: not _tsigStat.stat.exists
      block:

        - name: Ensure ddns/tsig directory exists
          ansible.builtin.file:
            path: "{{ dataPath }}/ddns/tsig"
            state: directory
            mode:  '0700'

        - name: Locate tsig-keygen on the controller
          ansible.builtin.command:
            argv:
              - which
              - tsig-keygen
          register:     _tsigKeygenPath
          changed_when: false
          failed_when:  _tsigKeygenPath.rc != 0

        - name: Run tsig-keygen for [{{ _tsigKeyName }}]
          ansible.builtin.command:
            argv:
              - "{{ _tsigKeygenPath.stdout | trim }}"
              - -a
              - "{{ _tsigAlgorithm }}"
              - "{{ _tsigKeyName }}"
          register:     _tsigKeygen
          changed_when: true

        - name: Extract secret from tsig-keygen output
          ansible.builtin.set_fact:
            _tsigSecret: "{{ _tsigKeygen.stdout | regex_search('secret \"([^\"]+)\"', '\\1') | first }}"
          no_log: true

        - name: Vault-encrypt the TSIG secret
          ansible.builtin.command:
            argv:
              - ansible-vault
              - encrypt_string
              - --vault-password-file
              - "{{ lookup('env', 'HOME') }}/.ansibleVaultPWD"
              - --name
              - secret
              - "{{ _tsigSecret }}"
          register:     _tsigVault
          changed_when: false
          no_log:       true

        - name: Write TSIG key YAML
          ansible.builtin.copy:
            dest: "{{ _tsigKeyFile }}"
            mode: '0600'
            content: |
              ##############################################################################
              # TSIG key for {{ domain }} — used by isc-dhcp-server to authenticate
              # DDNS updates against bind9. Generated by roles/pki/manageTSIG.
              #
              # Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
              # Licensed under Apache License 2.0. See LICENSE.md for details.
              #
              # Generated: {{ ansible_date_time.iso8601 | default('unknown') }}
              ##############################################################################
              ---
              tsigKey:
                name:      "{{ _tsigKeyName }}"
                algorithm: "{{ _tsigAlgorithm }}"
                {{ _tsigVault.stdout | indent(2) }}

  vars:
    _tsigKeyName:   "{{ tsigKeyName   | default(domain ~ '-ddns') }}"
    _tsigAlgorithm: "{{ tsigAlgorithm | default('hmac-sha256') }}"
    _tsigKeyFile:   "{{ dataPath }}/ddns/tsig/{{ domain }}.tsig.key.yaml"

- name: Cleanup temporary facts
  ansible.builtin.set_fact:
    _tsigStat:       null
    _tsigKeygenPath: null
    _tsigKeygen:     null
    _tsigSecret:     null
    _tsigVault:      null
