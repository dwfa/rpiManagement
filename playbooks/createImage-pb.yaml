##############################################################################
# Create Raspberry Pi image
#
# USAGE:
#   Creates RPi OS images on removable media (SD cards, USB drives).
#   Supports both local (macOS) and remote (Linux) target hosts.
#
# EXAMPLE:
#   ./createImage.sh                                    # localhost (macOS)
#   ./createImage.sh -n installer                       # remote Linux host
#   # or directly:
#   ansible-playbook --extra-vars "nodes=localhost" playbooks/createImage-pb.yaml
#   ansible-playbook --extra-vars "nodes=installer" playbooks/createImage-pb.yaml
#
# WORKFLOW:
#   Play 1 (localhost):
#     1. loadCredentials: Load vault-encrypted credentials
#     2. updateRPiImage: Download/update RPi OS image to data/images/
#   Play 2 (target host):
#     3. getInstallDevice: Detect single available external drive
#     4. createRPiImage: Copy image to target (if remote), write to disk
#     5. initRPiImage: Copy init files and configure boot partition
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: February 01, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Play 1: Load credentials and manage image locally
# Note: updateRPiImage must run on localhost where data/ directory exists
##############################################################################
- name: Prepare local resources
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - loadCredentials
    - updateRPiImage

##############################################################################
# Play 2: Execute on target hosts
##############################################################################
- name: Create RPi Image
  hosts:        "{{ nodes }}"
  become:       true
  gather_facts: true

# Load connection vars in two parts:
#   1. connectionBase.yaml - always loaded, SSH key used if exists
#   2. connectionPWD.yaml  - only loaded when SSH key missing
  vars_files:
    - "{{ playbook_dir }}/vars/connectionBase.yaml"
    - "{{ playbook_dir }}/vars/connectionPWD.yaml if ((lookup('fileglob', (playbook_dir ~ '/../data/ssh/ssh_key')) | length) == 0) else omit }}"

  roles:
    - role: getInstallDevice
    - role: createRPiImage
    - role: initRPiImage
