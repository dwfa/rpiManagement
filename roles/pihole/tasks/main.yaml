##############################################################################
# Install + configure pi-hole -- thin role wrapper
#
# USAGE:
#   Wraps tasks/pihole/install.yaml and tasks/pihole/configure.yaml in
#   the canonical install-then-configure order. Pi-hole is not an apt
#   package (its official installer is a curl|bash script), so it does
#   not fit the installPackages auto-discovery flow; this role is the
#   project's entry point for putting pi-hole on a host.
#
# REQUIRED VARIABLES:
#   - userData: decrypted by prepareRemoteCredentials in Play 1.
#               sudoPWD is double-sha256'd into WEBPASSWORD.
#
# OPTIONAL VARIABLES:
#   - piholeInterface: LAN interface for pi-hole to listen on
#                      (default: eth0)
#   - ipv4Address:     CIDR address pi-hole reports as its own
#                      (default: ansible_default_ipv4.address + /16)
#   - debugFlag:       Enable debug output
#
# EXAMPLE:
#   - hosts:  "{{ nodes }}"
#     become: true
#     roles:
#       - role: pihole
#
# NOTES:
#   - install.yaml is idempotent: skips when /usr/local/bin/pihole
#     already exists. configure.yaml always re-renders setupVars.conf,
#     so metadata changes are picked up on every run.
#   - See data/BACKLOG.md "Revisit containerized pi-hole" for the
#     rationale behind the native (not Docker) deployment.
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.0
# Date: May 10, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Step 1: Install pi-hole (idempotent -- skips if already installed)
##############################################################################
- name: Install pi-hole
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/pihole/install.yaml"

##############################################################################
# Step 2: Configure pi-hole (re-renders setupVars.conf, drops nginx
# snippet, restarts pihole-FTL + reloads nginx as needed)
##############################################################################
- name: Configure pi-hole
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/pihole/configure.yaml"