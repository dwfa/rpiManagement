##############################################################################
# Configure isc-dhcp-server: render /etc/dhcp/dhcpd.conf + the
# /etc/default/isc-dhcp-server file from the network inventory
# (netInventory) + data/ddns/tsig/*.
#
# USAGE:
#   Step 2 of installDHCPdServer's tasks/main.yaml. reconfigureDNSServer
#   runs it on its own via include_role tasks_from: configureDHCPd.
#   Loads dhcp-specific metadata, builds netInventory (via the
#   shared parseInventory adapter), loads the
#   vault-encrypted TSIG key shared with bind9, renders the config
#   with DDNS enabled, validates with `dhcpd -t`, then enables +
#   restarts the service. A systemd drop-in ensures dhcpd starts
#   after bind9 (dhcpd needs bind9 up to accept DDNS updates).
#
# REQUIRED VARIABLES:
#   None at the call site. Driven by:
#     - data/packages/isc-dhcp-server/metadata.yaml
#     - netInventory (built by tasks/network/parseInventory.yaml)
#     - data/ddns/tsig/{{ domain }}.tsig.key.yaml (TSIG key)
#
# OPTIONAL VARIABLES:
#   - debugFlag: Enable debug output
#
# WORKFLOW:
#   1. Load dhcp metadata (listen interface, TSIG path)
#   2. Build netInventory (cached per play)
#   3. Load TSIG key YAML (vault-encrypted secret decrypted in-task)
#   4. Render /etc/dhcp/dhcpd.conf (DDNS block + reservations)
#   5. Render /etc/default/isc-dhcp-server (listen interface)
#   6. Drop systemd override so dhcpd waits for bind9
#   7. Validate the rendered config with `dhcpd -t`
#   8. Reload systemd and enable + restart isc-dhcp-server
#
# NOTES:
#   - Reservations still cover dhcpManaged hosts; DDNS pushes their
#     A/PTR records to bind9 at lease time so bind9's zone files
#     stay skeleton (SOA/NS/static hosts only).
#   - `dhcpd -t` runs BEFORE restart so a bad config doesn't take
#     down the running daemon.
#   - Systemd ordering is a small drop-in at
#     /etc/systemd/system/isc-dhcp-server.service.d/after-bind9.conf
#     so we don't fork the upstream unit file.
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 3.0
# Date: October 11, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Step 1: Load dhcp metadata
##############################################################################
- name: Load isc-dhcp-server configuration manifest
  ansible.builtin.include_vars:
    file: "{{ dataPath }}/packages/isc-dhcp-server/metadata.yaml"

##############################################################################
# Step 2: Build netInventory (cached per play)
##############################################################################
- name: Ensure network inventory is parsed
  ansible.builtin.include_tasks: "{{ taskPath }}/network/parseInventory.yaml"

##############################################################################
# Step 3: Load the TSIG key shared with bind9
##############################################################################
- name: Load TSIG key
  ansible.builtin.include_vars:
    file: "{{ tsigKeyPath }}"

##############################################################################
# Step 4: Render /etc/dhcp/dhcpd.conf
##############################################################################
- name: Render /etc/dhcp/dhcpd.conf
  ansible.builtin.template:
    src:    dhcpd.conf.j2
    dest:   /etc/dhcp/dhcpd.conf
    owner:  root
    group:  root
    mode:   '0644'
    backup: true

##############################################################################
# Step 5: Render /etc/default/isc-dhcp-server (sets listen interface)
##############################################################################
- name: Render /etc/default/isc-dhcp-server
  ansible.builtin.template:
    src:    defaults.j2
    dest:   /etc/default/isc-dhcp-server
    owner:  root
    group:  root
    mode:   '0644'
    backup: true

##############################################################################
# Step 6: Systemd ordering — dhcpd waits for bind9
##############################################################################
- name: Ensure dhcpd systemd override directory exists
  ansible.builtin.file:
    path:  /etc/systemd/system/isc-dhcp-server.service.d
    state: directory
    owner: root
    group: root
    mode:  '0755'

- name: Drop systemd override making dhcpd depend on bind9
  ansible.builtin.copy:
    dest: /etc/systemd/system/isc-dhcp-server.service.d/after-bind9.conf
    owner: root
    group: root
    mode:  '0644'
    content: |
      # Rendered by installDHCPdServer's configureDHCPd.yaml.
      # Do NOT edit by hand.
      #
      # dhcpd needs bind9 running to deliver DDNS updates. Without this
      # ordering, dhcpd can start first at boot and queue update failures
      # until bind9 comes up.
      [Unit]
      After=bind9.service
      Wants=bind9.service
  register: _dhcpdSystemdDropIn

- name: Reload systemd to pick up drop-in changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: _dhcpdSystemdDropIn is changed

##############################################################################
# Step 7: Validate the rendered dhcpd.conf before letting the service load it
##############################################################################
- name: Validate dhcpd configuration
  ansible.builtin.command:
    cmd: dhcpd -t -cf /etc/dhcp/dhcpd.conf
  changed_when: false

##############################################################################
# Step 8: Enable + restart isc-dhcp-server
##############################################################################
- name: Enable and restart isc-dhcp-server
  ansible.builtin.systemd:
    name:    isc-dhcp-server
    enabled: true
    state:   restarted
