---                                            # identifies a YAML config file

##############################################################################
# Boot partition device path
# macOS: /dev/disk6 → /dev/disk6s1 (partition slice)
# Linux: /dev/sdb → /dev/sdb1 (partition number)
# Override: Pass bootPartitionDevice variable when calling role
##############################################################################
_bootPartitionDevice: "{{ bootPartitionDevice | default(installDevice + ('s1' if ansible_system == 'Darwin' else '1')) }}"
