##############################################################################
# Create multiple user accounts — from a directory scan or an explicit
# list of usernames
#
# USAGE:
#   Two modes, exactly one of which must be provided:
#     - userDataDir: scan the directory for subdirectories, treat each
#                    as a username, look for user.yaml inside
#     - userNames:   take the list as-is; resolve each name to the
#                    conventional "{{ dataDir }}/users/<uName>/user.yaml"
#
# REQUIRED VARIABLES (exactly one of):
#   - userDataDir: Path to a directory containing user subdirectories
#   - userNames:   List of usernames to create
#
# OPTIONAL VARIABLES:
#   - debugFlag: Enable debug output
#
# WORKFLOW:
#   1. Validate exactly one input is provided
#   2. If userDataDir → discoverDirs, then loop createUser per
#      discovered subdirectory
#   3. If userNames   → loop createUser per name, deriving the path by
#      convention
#
# EXAMPLE:
#   # Directory scan
#   - include_tasks: "{{ taskDir }}/users/createUsers.yaml"
#     vars:
#       userDataDir: "{{ dataDir }}/users/default"
#
#   # Explicit list
#   - include_tasks: "{{ taskDir }}/users/createUsers.yaml"
#     vars:
#       userNames:
#         - dwfa
#         - alice
#
# NOTES:
#   - Each user.yaml must exist at its expected path; createUser fails
#     loudly if the file is missing
#   - Loops use loop_var: userIdx per the project's <noun>Idx convention
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: May 4, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Validate: exactly one of userDataDir or userNames must be provided
##############################################################################
- name: Validate required input
  ansible.builtin.fail:
    msg: >-
      [ERROR] *** createUsers task requires exactly one of userDataDir
      or userNames to be provided
  when: >-
    ([userDataDir is defined,
      userNames   is defined] | select | list | length) != 1

##############################################################################
# Mode A — userDataDir: discover subdirectories, then loop createUser
##############################################################################
- name: Mode A — directory scan
  when: userDataDir is defined
  block:

    - name: Discover user subdirectories
      ansible.builtin.include_tasks:
        file: "{{ taskDir }}/files/discoverDirs.yaml"
      vars:
        searchDir: "{{ userDataDir }}"

    - name: Create each discovered user
      when: discoveredDirs | length > 0
      ansible.builtin.include_tasks:
        file: "{{ taskDir }}/users/createUser.yaml"
      vars:
        userDataPath: "{{ userDataDir }}/{{ userIdx }}/user.yaml"
      loop: "{{ discoveredDirs }}"
      loop_control:
        loop_var: userIdx
        label:    "{{ userIdx }}"

    - name: Cleanup temporary facts
      ansible.builtin.set_fact:
        discoveredDirs: null

##############################################################################
# Mode B — userNames: loop the supplied list directly. createUser.yaml
# accepts uName and derives the path by convention internally, so the
# vars: rebinding here is a single substitution from the loop_var (no
# nested templates that could trigger Ansible's eager-evaluation bug).
##############################################################################
- name: Mode B — explicit list of names
  when: userNames is defined
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/users/createUser.yaml"
  vars:
    uName: "{{ userIdx }}"
  loop: "{{ userNames }}"
  loop_control:
    loop_var: userIdx
    label:    "{{ userIdx }}"