##############################################################################
# Ansible task to copy files from source to destination based on metadata
#
# USAGE:
#   Generic task to copy files from a source directory to a destination directory.
#   Files to copy are defined in a metadata YAML file with an '_initFiles' list.
#   Source and destination can be overridden or use defaults from metadata.
#   Caller is responsible for mounting/unmounting if needed.
#
# REQUIRED VARIABLES:
#   - metadataPath: Path to metadata YAML file defining files to copy
#
# OPTIONAL VARIABLES:
#   - sourceDir: Override source directory (metadata default: _srcDir)
#   - destDir: Override destination directory (metadata default: _destDir)
#   - debugFlag: Enable debug output
#
# WORKFLOW:
#   1. Load file configuration from metadataFile (_srcDir, _destDir, _initFiles)
#   2. Copy each file from _srcDir to _destDir (using passed overrides if provided)
#   3. Display copy status (debug mode only)
#   4. Cleanup temporary variables
#
# EXAMPLE:
#   - name: Copy RPi init files using metadata defaults
#     include_tasks:
#       file: "{{ taskDir }}/files/copyFiles.yaml"
#     vars:
#       metadataPath: "{{ dataDir }}/rpi/imageBuild.yaml"
#
#   - name: Copy RPi init files with override
#     include_tasks:
#       file: "{{ taskDir }}/files/copyFiles.yaml"
#     vars:
#       metadataPath: "{{ dataDir }}/rpi/imageBuild.yaml"
#       destDir: "/custom/destination"
#
# NOTES:
#   - Metadata file must contain '_initFiles' list and optionally _srcDir/_destDir
#   - Metadata defines: _srcDir (with sourceDir override), _destDir (with destDir override)
#   - Each _initFiles entry can specify: file (required), mode (optional, default: 0644)
#   - Example metadata: _srcDir: "{{ sourceDir | default(dataDir + '/rpi') }}"
#   - Caller must ensure destDir is accessible (mounted if needed)
#   - Requires write permissions to destDir
#   - Generic: can copy from any source to any destination with any metadata
#   - fileIdx is the loop_var per the project's <noun>Idx convention; each
#     iteration's value is the list element (a dict with file/mode keys)
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 5.0
# Date: May 7, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Load file configuration from metadata
##############################################################################
- name: Load file configuration from metadata
  include_vars:
    file: "{{ metadataPath }}"

##############################################################################
# Copy files from source to destination
##############################################################################
- name: Copy files from source to destination
  ansible.builtin.copy:
    dest: "{{ _destDir }}/{{ fileIdx.file }}"
    mode: "{{ fileIdx.mode | default('0644') }}"
    src:  "{{ _srcDir }}/{{ fileIdx.file }}"
  loop: "{{ _initFiles }}"
  loop_control:
    loop_var: fileIdx
    label:    "{{ fileIdx.file }}"
  register: _cifResult

- name: Display copy status
  debug:
    msg: >-
      {{ '[DEBUG] *** Copied [' + (_cifResult.results | length | string) + '] files from [' + _srcDir + '] to [' + _destDir + ']'
           if _cifResult is succeeded else
         '[DEBUG] *** Failed to copy files' }}
  when: debugFlag is defined

##############################################################################
# Cleanup temporary facts
# Note: Clean up all variables loaded from metadata file and registered vars
##############################################################################
- name: Cleanup temporary facts
  set_fact:
    _cifResult: null
    _destDir: null
    _srcDir: null
    _fileSystems: null
    _initFiles: null
