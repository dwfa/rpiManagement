##############################################################################
# Build Raspberry Pi image
#
# USAGE:
#   Builds RPi OS images onto removable storage (SD cards, USB drives).
#   Supports both local (macOS) and remote (Linux) target hosts.
#
# EXAMPLE:
#   ./createImage.sh                                    # localhost (macOS)
#   ./createImage.sh -n installer                       # remote Linux host
#   # or directly:
#   ansible-playbook --extra-vars "nodes=localhost" playbooks/buildRPiImage-pb.yaml
#   ansible-playbook --extra-vars "nodes=installer" playbooks/buildRPiImage-pb.yaml
#
# WORKFLOW:
#   Play 1 (localhost):
#     1. prepareRemoteCredentials: Load vault-encrypted credentials and
#        materialize SSH keys to data/ssh/ (skips if no keys present)
#     2. updateRPiImage: Download/update RPi OS image to data/images/
#   Play 2 (target host):
#     3. getInstallDevice: Detect single available external drive
#     4. createRPiImage: Copy image to target (if remote), write to disk
#     5. initRPiImage: Copy init files and configure boot partition
#   Play 3 (localhost):
#     6. clearLocal: Remove materialized SSH key files from data/ssh/
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.4
# Date: March 22, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Play 1: Load credentials, materialize SSH keys, manage image locally
# Note: updateRPiImage must run on localhost where data/ directory exists
##############################################################################
- name: Prepare local resources
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: bootstrap
    - role: prepareRemoteCredentials
      vars:
        userDataPath: "{{ dataPath }}/users/dwfa/user.yaml"
    - role: updateRPiImage

##############################################################################
# Play 2: Execute on target hosts
##############################################################################
- name: Create RPi Image
  hosts:        "{{ nodes | default('localhost') }}"
  become:       true
  gather_facts: false                      # explicit setup below so it
                                           # runs AFTER include_vars

  pre_tasks:
    ##########################################################################
    # Load remote connection vars (connectionKey.yaml or connectionPWD.yaml)
    # at task time -- AFTER Play 1 has set hostvars['localhost'].userData.
    # Replaces the play-level `vars_files:` form, which ansible-core 2.21+
    # validates at parse time (before Play 1 runs) and warns loudly when
    # the templated path references an undefined var.
    #
    # include_vars is a controller-side action -- no SSH needed -- so
    # gather_facts (explicit setup, next) is the first task to actually
    # connect to the target. By then, ansible_user / ansible_ssh_* /
    # ansible_become_password are all in play scope.
    ##########################################################################
    - name: Load remote connection vars
      ansible.builtin.include_vars:
        file: "{{ pbPath }}/vars/connection{{ hostvars['localhost'].userData.file }}.yaml"

    - name: Gather facts now that connection vars are loaded
      ansible.builtin.setup:

  roles:
    - role: getInstallDevice
    - role: createRPiImage
    - role: initRPiImage
      vars:
        userDataPath: "{{ dataPath }}/users/installer/user.yaml"

##############################################################################
# Play 3: Cleanup materialized SSH keys
##############################################################################
- name: Cleanup materialized SSH keys
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: clearLocal