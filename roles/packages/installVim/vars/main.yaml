---                                            # identifies a YAML config file

vimPackages:
  - vim

# Files copied to the target (tasks/files/copyFiles.yaml fileList)
vimFiles:
  - src:    "{{ role_path }}/files/vimrc.local"
    dest:   /etc/vim/vimrc.local
    owner:  root
    group:  root
    backup: true
