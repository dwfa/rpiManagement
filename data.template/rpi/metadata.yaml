##############################################################################
# Raspberry Pi boot partition file copy metadata
#
# USAGE:
#   Defines initialization files to copy to RPi boot partition during image
#   creation. Used by tasks/files/copyFiles.yaml via createRPiImage role.
#
# STRUCTURE:
#   _srcDir: Source directory for init files (typically {{ dataPath }}/rpi)
#   _destDir: Destination directory (typically {{ bootMountPoint }})
#   _initFiles: Dictionary of files to copy
#     Each entry:
#       key: Logical name for the file
#       src: Source filename (relative to _srcDir)
#       dest: Destination filename (relative to _destDir)
#
# CUSTOMIZATION:
#   1. Verify _srcDir and _destDir paths are correct
#   2. Add/remove entries in _initFiles section
#   3. Ensure source files exist in data/rpi/ directory
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.0
# Date: October 28, 2025
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Source and destination directories
##############################################################################
_srcDir:  "{{ dataPath }}/rpi"
_destDir: "{{ bootMountPoint }}"

##############################################################################
# Initialization files to copy to boot partition
##############################################################################
_initFiles:
  # Enable SSH on first boot
  ssh:
    src:  "ssh"
    dest: "ssh"

  # User credentials for first boot (username:encrypted_password)
  userconf:
    src:  "userconf.txt"
    dest: "userconf.txt"

  # TODO: Add additional initialization files as needed
  # Example - WiFi configuration (legacy, not recommended for modern RPi OS):
  # wpa_supplicant:
  #   src:  "wpa_supplicant.conf"
  #   dest: "wpa_supplicant.conf"
