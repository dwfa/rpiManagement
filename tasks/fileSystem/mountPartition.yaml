##############################################################################
# Ansible task to mount a partition to a specified mount point
#
# USAGE:
#   Generic partition mounting task that creates the mount point directory
#   if needed and mounts the specified partition. Handles mount errors
#   appropriately.
#
# REQUIRED VARIABLES:
#   - partitionDevice: Device path to partition in Unix-style format (e.g., /dev/disk41, /dev/sdb1)
#                      Automatically converted to macOS format (/dev/disk4s1) if needed
#   - mountPoint: Directory path where partition should be mounted (e.g., /mnt/boot)
#   - debugFlag: (optional) Enable debug output
#
# WORKFLOW:
#   1. Validate platform is supported (macOS or Linux)
#   2. Normalize partition path (convert Unix-style to macOS format if needed)
#   3. Create mount point directory if it doesn't exist
#   4. Check if partition is already mounted elsewhere and unmount if needed
#   5. Check if mount point has something mounted and unmount if needed
#   6. Mount partition using platform-specific command
#   7. Display mount status (debug mode only)
#   8. Cleanup temporary variables
#
# EXAMPLE:
#   - name: Mount boot partition
#     include_tasks:
#       file: "{{ taskDir }}/fileSystem/mountPartition.yaml"
#     vars:
#       partitionDevice: "/dev/disk41"  # Unix-style (auto-converted to /dev/disk4s1 on macOS)
#       mountPoint: "/mnt/boot"
#
# NOTES:
#   - Requires sudo/root permissions for mount operations
#   - Supported platforms: macOS (Darwin) and Linux only
#   - Mount point directory is created with mode 0755
#   - Partition path normalization:
#     - Accepts Unix-style paths (e.g., /dev/disk41, /dev/sdb1)
#     - Automatically converts to macOS format on Darwin (e.g., /dev/disk41 → /dev/disk4s1)
#     - Linux paths pass through unchanged
#   - Robust idempotency:
#     - Unmounts partition if already mounted elsewhere
#     - Unmounts mount point if something else is mounted there
#     - Reuses unmountPartition.yaml task for all unmount operations (DRY)
#   - Platform-specific mount/unmount commands:
#     - macOS: diskutil mount/unmount
#     - Linux: mount/umount
#   - Fails if mount operation returns non-zero exit code
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 5.2
# Date: October 25, 2025
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Validate required parameters and platform
##############################################################################
- name: Validate required parameters
  block:
    - name: Validate partitionDevice is provided
      fail:
        msg: "[ERROR] *** partitionDevice is required for mountPartition task but not provided"
      when: partitionDevice is not defined or partitionDevice == ''

    - name: Validate mountPoint is provided
      fail:
        msg: "[ERROR] *** mountPoint is required for mountPartition task but not provided"
      when: mountPoint is not defined or mountPoint == ''

    - name: Validate platform is supported
      fail:
        msg: "[ERROR] *** Unsupported platform [{{ ansible_system }}]. Only Darwin (macOS) and Linux are supported."
      when: ansible_system not in ['Darwin', 'Linux']

##############################################################################
# Normalize partition path for platform (Unix-style to macOS if needed)
##############################################################################
- name: Normalize partition path for platform
  set_fact:
    _normalizedPartitionPath: "{{ partitionDevice if ansible_system != 'Darwin' else
                                 (partitionDevice | regex_replace('^(/dev/disk\\d+)(\\d+)$', '\\1s\\2')) }}"

##############################################################################
# Create mount point directory
##############################################################################
- name: Create mount point directory
  ansible.builtin.file:
    path: "{{ mountPoint }}"
    mode: '0755'
    state: directory

##############################################################################
# Check and unmount partition if already mounted elsewhere
##############################################################################
- name: Check if partition is already mounted
  ansible.builtin.shell:
    cmd: "mount | grep -q '^{{ _normalizedPartitionPath }} on '"
  register: _partitionMountCheck
  failed_when: false
  changed_when: false

- name: Unmount partition if already mounted elsewhere
  block:
    - name: Display partition mount check status
      debug:
        msg: "[DEBUG] *** Partition [{{ _normalizedPartitionPath }}] is already mounted, will unmount first"
      when: debugFlag is defined

    - name: Unmount partition
      include_tasks:
        file: "{{ taskDir }}/fileSystem/unmountPartition.yaml"
      vars:
        mountPoint: "{{ _normalizedPartitionPath }}"
  when: _partitionMountCheck.rc == 0

##############################################################################
# Check and unmount mount point if something is already mounted there
##############################################################################
- name: Check if mount point has something mounted
  ansible.builtin.shell:
    cmd: "mount | grep -q ' on {{ mountPoint }} '"
  register: _mountPointCheck
  failed_when: false
  changed_when: false

- name: Unmount mount point if in use
  block:
    - name: Display mount point check status
      debug:
        msg: "[DEBUG] *** Mount point [{{ mountPoint }}] has something mounted, will unmount first"
      when: debugFlag is defined

    - name: Unmount mount point
      include_tasks:
        file: "{{ taskDir }}/fileSystem/unmountPartition.yaml"
      vars:
        mountPoint: "{{ mountPoint }}"
  when: _mountPointCheck.rc == 0

##############################################################################
# Mount partition to mount point (platform-specific)
##############################################################################
- name: Mount partition (macOS)
  ansible.builtin.command:
    cmd: "diskutil mount -mountPoint {{ mountPoint }} {{ _normalizedPartitionPath }}"
  register: _mountPartitionResult
  failed_when: _mountPartitionResult.rc not in [0]
  when: ansible_system == 'Darwin'

- name: Mount partition (Linux)
  ansible.builtin.command:
    cmd: "mount {{ _normalizedPartitionPath }} {{ mountPoint }}"
  register: _mountPartitionResult
  failed_when: _mountPartitionResult.rc not in [0]
  when: ansible_system == 'Linux'

- name: Display mount status
  debug:
    msg: "[DEBUG] *** Mounted partition [{{ _normalizedPartitionPath }}] to [{{ mountPoint }}]"
  when: debugFlag is defined

##############################################################################
# Cleanup temporary facts (play-scoped register variables)
##############################################################################
- name: Cleanup temporary facts
  set_fact:
    _normalizedPartitionPath: null
    _partitionMountCheck: null
    _mountPointCheck: null
    _mountPartitionResult: null
