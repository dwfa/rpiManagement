##############################################################################
# macOS implementation for device detection
#
# Snapshots the external-disk list via `diskutil list external` before
# and after the user attaches the target storage device, computes the
# diff, and sets `newDevices` as a list of /dev/diskN paths.
#
# Universal validation + selection (fail-on-0, fail-on-many, set
# installDevice on 1) is done by roles/getInstallDevice/tasks/main.yaml
# AFTER this file returns. This file's sole contract: leave
# `newDevices` set as a normalized list.
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: May 17, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Validate platform compatibility
##############################################################################
- name: Fail if not running on macOS
  ansible.builtin.fail:
    msg: "[ERROR] *** This task requires macOS but running on [{{ ansible_facts['system'] }}]"
  when: ansible_facts['system'] != 'Darwin'

##############################################################################
# Snapshot 1: external-disk list BEFORE the user attaches anything
##############################################################################
- name: Get set of initial external devices
  ansible.builtin.shell:
    cmd: /usr/sbin/diskutil list external
  register: _initialExternalDevices

##############################################################################
# Pause for the user to attach the storage device
##############################################################################
- name: Ask and wait for new device to be attached
  ansible.builtin.include_tasks:
    file: "{{ taskPath }}/misc/niceWait.yaml"
  vars:
    title: "Attach external device"
    data: "Attach external device & press Enter to continue ..."

##############################################################################
# Snapshot 2: external-disk list AFTER attachment
##############################################################################
- name: Get current external devices
  ansible.builtin.shell:
    cmd: /usr/sbin/diskutil list external
  register: _currentExternalDevices

##############################################################################
# Compute the diff and normalize each entry to a /dev/diskN base path
# (strip any partition suffix). Sets the `newDevices` fact -- the
# role's main.yaml does the validation.
##############################################################################
- name: Compute newly-attached devices
  ansible.builtin.set_fact:
    newDevices: >-
      {{ _currentDevices | difference(_initialDevices)
                         | map('regex_replace', '^(/dev/disk\\d+).*$', '\\1')
                         | list | unique }}
  vars:
    _initialDevices: "{{ _initialExternalDevices.stdout_lines | select('match', '/dev') | list }}"
    _currentDevices: "{{ _currentExternalDevices.stdout_lines | select('match', '/dev') | list }}"