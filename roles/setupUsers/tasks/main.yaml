##############################################################################
# Ansible role to setup users on freshly booted RPi
#
# USAGE:
#   Creates groups, creates users, and removes installer user. Orchestrates
#   the user management tasks for post-boot initialization.
#
# REQUIRED VARIABLES:
#   - groups: Dictionary of groups to create (key is name, value has: gid)
#   - users: List of users to create (each item has: uName, gName, gNames,
#       name, pwd, uid, shell)
#   - usersToRemove: List of users to remove (each item has: uName)
#
# EXAMPLE:
#   - hosts: installer
#     roles:
#       - role: setupUsers
#         vars:
#           groups:
#             acheson:
#               gid: 1701
#           users:
#             - "{{ dwfaUserData }}"
#           usersToRemove:
#             - { uName: installer }
#
# NOTES:
#   - Groups are created first (users depend on groups existing)
#   - Users are created second
#   - Installer removal happens last (after new user can login)
#   - Requires ansible.posix collection for SSH key tasks
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.0
# Date: February 22, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Create groups
##############################################################################
- name: Create groups
  include_tasks:
    file: "{{ taskDir }}/users/createGroup.yaml"
  vars:
    groups: "{{ groups }}"
  when: groups is defined and groups | length > 0

##############################################################################
# Create users
##############################################################################
- name: Create users
  include_tasks:
    file: "{{ taskDir }}/users/createUser.yaml"
  vars:
    users: "{{ users }}"
  when: users is defined and users | length > 0

##############################################################################
# Remove installer user
##############################################################################
- name: Remove installer user
  include_tasks:
    file: "{{ taskDir }}/users/removeUser.yaml"
  vars:
    users: "{{ usersToRemove }}"
  when: usersToRemove is defined and usersToRemove | length > 0
