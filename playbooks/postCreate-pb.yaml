##############################################################################
# Post-create setup for freshly imaged RPi
#
# USAGE:
#   Configures a freshly booted RPi: normalizes installer IP to a known
#   static address (handles macOS-imaged hosts that boot via DHCP),
#   creates the main user, and removes the installer.
#
# EXAMPLE:
#   ansible-playbook --extra-vars "nodes=installer" playbooks/postCreate-pb.yaml
#
# WORKFLOW:
#   Play 1 (localhost):
#     1. getTargetHostIP: Resolve target IP (try known, prompt if
#        unreachable)
#     2. prepareRemoteCredentials: Load installer credentials for SSH
#   Play 2 (target - as installer):
#     3. setStaticIP: Normalize host to installer's static IP
#        (no-op if host is already on the static address)
#   Play 3 (target - as installer):
#     4. createUsers: Create default user (loads own data, ensures
#        groups exist, installs SSH keys)
#   Play 4 (localhost — switch credentials):
#     5. clearLocal: Remove installer's materialized SSH keys
#     6. prepareRemoteCredentials: Load main user (dwfa) credentials
#   Play 5 (target - as main user):
#     7. removeUsers: Remove installer user
#   Play 6 (localhost):
#     8. clearLocal: Remove dwfa's materialized SSH keys
#
# NOTES:
#   - RPi must be freshly imaged with installer user configured
#   - Known static IP (e.g. 192.168.129.1) tried first; if unreachable
#     (macOS-imaged RPi without preconfigured static IP), user is
#     prompted for the DHCP-assigned address
#   - Play 2's setStaticIP normalizes the host onto the installer's
#     static IP and updates `newTarget` so subsequent plays connect
#     there. If the host is already on the static IP (Linux-imaged
#     path), the role's online strategy short-circuits.
#   - After completion, RPi has default user and installer is removed
#   - Play 4 runs clearLocal BEFORE prepareRemoteCredentials so the
#     new user's SSH keys do not collide with (or get wiped by) the
#     installer's keys on disk
#   - getTargetHostIP sets the localhost fact `newTarget`; Plays 2, 3,
#     and 5 reference it via `hosts: "{{ hostvars['localhost'].newTarget }}"`
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 3.0
# Date: April 29, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Play 1: Resolve target host IP and load installer credentials (localhost)
# Note: Vault decryption works on localhost (task-level include_vars)
##############################################################################
- name: Load installer credentials and resolve target host
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: getTargetHostIP
      vars:
        targetHost: "{{ groups[nodes] | first }}"
    - role: prepareRemoteCredentials
      vars:
        userDataPath: "{{ dataDir }}/users/installer/user.yaml"

##############################################################################
# Play 2: Normalize installer to known static IP (online strategy).
# Skips internally if the host is already on the static address.
# After this play, hostvars['localhost'].newTarget == installer's static IP.
##############################################################################
- name: Normalize installer to static IP
  hosts:        "{{ hostvars['localhost'].newTarget }}"
  become:       true
  gather_facts: false

# Load remote connection vars (connectionKey.yaml or connectionPWD.yaml)
  vars_files:
    - "{{ playbook_dir }}/vars/connection{{ hostvars['localhost'].userData.file }}.yaml"

  roles:
    - role: setStaticIP
      vars:
        currentAddress:   "{{ hostvars['localhost'].newTarget }}"
        staticIPDataPath: "{{ dataDir }}/network/staticIP/installer.yaml"

##############################################################################
# Play 3: Connect as installer, create main user (groups + SSH keys)
##############################################################################
- name: Create 1st real users
  hosts:        "{{ hostvars['localhost'].newTarget }}"
  become:       true
  gather_facts: true

# Load remote connection vars (connectionKey.yaml or connectionPWD.yaml)
  vars_files:
    - "{{ playbook_dir }}/vars/connection{{ hostvars['localhost'].userData.file }}.yaml"

  roles:
    - role: createUsers
      vars:
        userDataPath: "{{ dataDir }}/users/dwfa/user.yaml"

##############################################################################
# Play 4: Switch credentials on localhost
#   - clearLocal removes installer's materialized SSH keys first
#   - prepareRemoteCredentials then loads dwfa (materializes dwfa's keys)
# Role order matters: cleanup MUST precede new materialization.
##############################################################################
- name: Switch credentials (cleanup installer keys, load main user)
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: clearLocal
    - role: prepareRemoteCredentials
      vars:
        userDataPath: "{{ dataDir }}/users/dwfa/user.yaml"

##############################################################################
# Play 5: Connect as main user, remove installer
##############################################################################
- name: Remove installer user (as main user)
  hosts:        "{{ hostvars['localhost'].newTarget }}"
  become:       true
  gather_facts: true

# Load remote connection vars (connectionKey.yaml or connectionPWD.yaml)
  vars_files:
    - "{{ playbook_dir }}/vars/connection{{ hostvars['localhost'].userData.file }}.yaml"

  roles:
    - role: removeUsers
      vars:
        userDataPath: "{{ dataDir }}/users/installer/user.yaml"

##############################################################################
# Play 6: Final cleanup of materialized SSH keys
##############################################################################
- name: Cleanup materialized SSH keys
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: clearLocal