##############################################################################
# Ansible task to copy RPi initialization files from source to destination
#
# USAGE:
#   Generic task to copy Raspberry Pi initialization files (ssh, userconf.txt, etc.)
#   from a source directory to a destination directory. Files to copy are defined
#   in metadata.yaml. Caller is responsible for mounting/unmounting if needed.
#
# REQUIRED VARIABLES:
#   - sourceDir: Source directory path containing init files and metadata.yaml
#   - destDir: Destination directory path where files should be copied
#   - dataDir: Path to data directory (for metadata.yaml loading)
#   - debugFlag: (optional) Enable debug output
#
# WORKFLOW:
#   1. Load init file configuration from sourceDir/metadata.yaml
#   2. Copy each init file from sourceDir to destDir
#   3. Display copy status (debug mode only)
#   4. Cleanup temporary variables
#
# EXAMPLE:
#   - name: Copy init files to mounted boot partition
#     include_tasks:
#       file: "{{ taskDir }}/rpi/copyRPiInitFiles.yaml"
#     vars:
#       sourceDir: "{{ dataDir }}/rpi"
#       destDir: "/Volumes/boot"
#
# NOTES:
#   - Init files are defined in metadata.yaml (in sourceDir or dataDir/rpi/)
#   - Typical files: ssh (enable SSH), userconf.txt (user credentials)
#   - Caller must ensure destDir is accessible (mounted if needed)
#   - Requires write permissions to destDir
#   - Generic: can copy from any source to any destination
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 4.0
# Date: October 25, 2025
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Load init file configuration from metadata
##############################################################################
- name: Load required data
  include_vars:
    file: "{{ dataDir }}/rpi/metadata.yaml"

##############################################################################
# Copy init files from source to destination
##############################################################################
- name: Copy init files from source to destination
  ansible.builtin.copy:
    dest: "{{ destDir }}/{{ initFiles[item].file }}"
    src: "{{ sourceDir }}/{{ initFiles[item].file }}"
    mode: 0644
  with_items: "{{ initFiles.keys() | list }}"
  register: _cifResult

- name: Display copy status
  debug:
    msg: >-
      {{ '[DEBUG] *** Copied [' + (_cifResult.results | length | string) + '] init files from [' + sourceDir + '] to [' + destDir + ']'
           if _cifResult is succeeded else
         '[DEBUG] *** Failed to copy init files' }}
  when: debugFlag is defined

##############################################################################
# Cleanup temporary facts (register variables)
##############################################################################
- name: Cleanup temporary facts
  set_fact:
    _cifResult: null
