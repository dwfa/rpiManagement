##############################################################################
# Ansible role to write RPi OS image to device
#
# USAGE:
#   Writes a Raspberry Pi OS image to a block device (USB drive, SD card, etc.).
#   Requires prerequisite roles to set facts for device and image paths.
#
# REQUIRED VARIABLES:
#   - installDevice: Target device path (e.g., /dev/disk4, /dev/sdb)
#       Must be set by getInstallDevice role before calling this role
#   - dataPath: Path to data directory (inherited from common role)
#   - taskPath: Path to tasks directory (inherited from common role)
#   - debugFlag: (optional) Enable debug output
#
# OPTIONAL VARIABLES:
#   - buildImageDir: Where images are kept on a remote build host
#       (default /usr/local/src/rpiImages, see defaults/main.yaml)
#
# WORKFLOW:
#   1. Set _imagePath based on local/remote execution context
#   2. Remote only: copy the image to buildImageDir/<release filename>.
#      Skipped when an identical copy is already there (checksum match)
#   3. Unmount all partitions on target device (prevents dd "device busy" errors)
#   4. Write image to device using writeImage.yaml task
#
# EXAMPLE:
#   - hosts: localhost
#     roles:
#       - role: getInstallDevice        # Sets installDevice fact
#       - role: updateRPiImage          # Sets imagePath fact (on localhost)
#       - role: createRPiImage          # Writes image to device
#       - role: initRPiImage            # Initializes boot partition
#
# NOTES:
#   - Requires sudo/root permissions for device write access
#   - User will be prompted to confirm destructive operation
#   - Validation performed in writeImage.yaml task
#   - Must run getInstallDevice and updateRPiImage roles first
#   - initRPiImage role should follow to initialize boot partition
#   - Remote targets keep their image copies in buildImageDir between
#       builds; ansible.builtin.copy checksums source and destination and
#       only transfers when they differ (missing, partial or changed file).
#       Old images are not pruned automatically.
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 6.1
# Date: September 29, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Set image path based on execution context
#   - local connection: {{ dataPath }}/images/currentRPiImage.img
#   - remote connection: {{ buildImageDir }}/<release filename>
##############################################################################
- name: Set image path (local)
  when: ansible_connection == 'local'
  ansible.builtin.set_fact:
    _imagePath: "{{ dataPath }}/images/currentRPiImage.img"

##############################################################################
# Resolve the release filename behind the currentRPiImage.img symlink.
# Deliberately NOT inside the remote-only block below: a delegated task
# evaluates `when:` as the delegated host (localhost, connection local),
# so the remote-only condition would always skip it.
##############################################################################
- name: Resolve current image release filename
  ansible.builtin.stat:
    path:   "{{ dataPath }}/images/currentRPiImage.img"
    follow: false
  delegate_to: localhost
  become:      false
  register:    _createImageLinkStat

##############################################################################
# Remote hosts: keep a copy of the image named by its release filename.
# ansible.builtin.copy checksums both ends and skips the transfer when the
# existing copy already matches.
##############################################################################
- name: Copy image to remote host
  when: ansible_connection != 'local'
  block:
    - name: Set image path (remote)
      ansible.builtin.set_fact:
        _imagePath: >-
          {{ buildImageDir }}/{{ _createImageLinkStat.stat.lnk_target | basename
             if (_createImageLinkStat.stat.islnk | default(false))
             else 'currentRPiImage.img' }}

    - name: Ensure image directory exists on remote host
      ansible.builtin.file:
        path:  "{{ buildImageDir }}"
        state: directory
        mode:  '0755'

    - name: Copy image to remote host (skipped if identical copy exists)
      ansible.builtin.copy:
        src:  "{{ dataPath }}/images/currentRPiImage.img"
        dest: "{{ _imagePath }}"
        mode: '0644'
      register: _createImageCopy

    - name: Report image copy
      ansible.builtin.debug:
        msg: >-
          [INFO] *** {{ 'Copied image to' if _createImageCopy.changed
                        else 'Reused existing image at' }} [{{ _imagePath }}]

##############################################################################
# Unmount all partitions on target device before writing
# Note: Idempotent - succeeds gracefully if device not mounted
##############################################################################
- name: Unmount all partitions on target device
  include_tasks:
    file: "{{ taskPath }}/fileSystem/unmountDevice.yaml"
  vars:
    device: "{{ installDevice }}"

##############################################################################
# Write RPi image to device
##############################################################################
- name: include task to write RPi Image to device
  include_tasks:
    file: "{{ taskPath }}/fileSystem/writeImage.yaml"
  vars:
    useDevice:    "{{ installDevice }}"
    useImagePath: "{{ _imagePath }}"

##############################################################################
# Cleanup temporary facts
##############################################################################
- name: Cleanup temporary facts
  ansible.builtin.set_fact:
    _imagePath: null
    _createImageLinkStat: null
    _createImageCopy: null
