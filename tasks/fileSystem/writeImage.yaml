##############################################################################
# Ansible task to write disk image to device
#
# USAGE:
#   Writes a compressed or uncompressed Raspberry Pi OS image to a block device
#   (USB drive, SD card, etc.). Supports gzip (.gz), xz (.xz), and raw (.img)
#   image formats. Uses dd for writing with progress reporting.
#
# REQUIRED VARIABLES:
#   - useImagePath: Full path to the image file (compressed or uncompressed)
#   - useDevice: Target device path (e.g., /dev/disk4, /dev/sdb)
#   - debugFlag: (optional) Enable debug output
#
# OUTPUT VARIABLES:
#   None - This task does not set any global facts
#
# WORKFLOW:
#   1. Extract file extension from imagePath
#   2. Determine decompression utility based on format
#   3. Fail if unsupported format
#   4. Set dd status flag (progress for local, none for remote)
#   5. macOS: verify useDevice is (external, physical) via diskutil
#   6. Prompt user to confirm destructive operation
#   7. Wipe old signatures from the device (wipeDevice.yaml)
#   8. Decompress (if needed) and write to devicePath:
#      - .gz: Use gzip -cd | dd
#      - .xz: Use xzcat | dd
#      - .img: Use cat | dd
#   9. Show progress during write operation (local only)
#
# EXAMPLE:
#   - name: Write RPi OS image to device
#     include_tasks:
#       file: "{{ taskPath }}/fileSystem/writeImage.yaml"
#     vars:
#       useImagePath: "/path/to/image.xz"
#       useDevice: "/dev/disk4"
#
# NOTES:
#   - Requires sudo/root permissions for dd device access
#   - DESTRUCTIVE OPERATION: Completely overwrites target device
#   - Uses 4M block size for performance
#   - Shows progress with status=progress (GNU dd)
#   - Image writing can take several minutes depending on size
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: September 29, 2026
##############################################################################
---                                            # identifies a YAML config file

#############################################################################
# Validate required parameters
##############################################################################
- name: Validate required parameters
  block:
    - name: validate useDevice is provided
      fail:
        msg: "[ERROR] *** useDevice is required for writeImage task but not provided"
      when: useDevice is not defined or useDevice == ''

    - name: validate useImagePath is provided
      fail:
        msg: "[ERROR] *** useImagePath is required for writeImage task but not provided"
      when: useImagePath is not defined or useImagePath == ''

#############################################################################
# Prepare write command
##############################################################################
- name: Prepare write command
  block:
    - name: set decompression utility based on image format
      set_fact:
        _decompressUtil: >-
          {{ 'gzip -cd'
               if _imageExt == '.gz' else
             'xzcat'
               if _imageExt == '.xz' else
             'cat'
               if _imageExt == '.img' else
             'unsupported' }}

    - name: fail for unsupported file extension
      fail:
        msg:
          - "[ERROR] *** Unsupported image format: [{{ _imageExt }}]."
          - "[ERROR] *** Supported formats: .gz, .xz, .img"
      when:
        - _decompressUtil == 'unsupported'

    - name: debug message for decompression utility
      debug:
        msg: "[DEBUG] *** decompression utility: [{{ _decompressUtil }}]"
      when:
        - debugFlag is defined

    - name: set dd status flag for local connections
      set_fact:
        _ddStatus: "{{ 'status=progress' if ansible_connection == 'local' else '' }}"
  vars:
    _imageExt: "{{ useImagePath | basename | splitext | last }}"

#############################################################################
# Validate useDevice (macOS only).
#
# Same live check as unmountDevice.yaml: ask diskutil about the device and
# refuse the write unless it reports (external, physical). Checks the real
# device, not the text of useDevice, so a bare /dev/diskN is enough.
##############################################################################
- name: Validate useDevice (macOS)
  when: ansible_facts['system'] == 'Darwin'
  vars:
    _devicePath: "{{ useDevice | regex_search('/dev/disk\\d+') | default('', true) }}"
    _isExtPhys: >-
      {{ (_writeImageDeviceInfo.rc | default(1)) == 0 and
         ((_writeImageDeviceInfo.stdout_lines | default([]) | first | default(''))
           is search('\(external, physical\)')) }}
  block:
    - name: Query useDevice from diskutil (macOS)
      ansible.builtin.command:
        argv:
          - diskutil
          - list
          - "{{ _devicePath }}"
      register:     _writeImageDeviceInfo
      changed_when: false
      failed_when:  false

    - name: Refuse device that is not external + physical (macOS)
      when: not _isExtPhys
      ansible.builtin.include_tasks: "{{ taskPath }}/ui/niceFail.yaml"
      vars:
        title: "Refusing to write image"
        data:
          - "useDevice = [{{ useDevice }}]"
          - "diskutil  = [{{ _writeImageDeviceInfo.stdout_lines | default([]) | first | default('no such device') }}]"
          - "Expected: /dev/diskN (external, physical)"

#############################################################################
# Write image to device
# _devicePath is extracted from the validated descriptor at task scope so it
# does not leak past this task; falls back to useDevice on non-macOS.
##############################################################################
- name: Write image to device
  block:
    - name: confirm write operation
      include_tasks:
        file: "{{ taskPath }}/ui/niceWait.yaml"
      vars:
        title: "Confirm write operation"
        data: "WARNING: About to write [{{ useImagePath }}] to [{{ _devicePath }}]. This will DESTROY all data on the device. Press Enter to continue or Ctrl+C then 'A' to abort..."

    - name: Wipe old device signatures
      ansible.builtin.include_tasks:
        file: "{{ taskPath }}/fileSystem/wipeDevice.yaml"
      vars:
        device: "{{ _devicePath }}"

    - name: write image to device
      ansible.builtin.shell:
        cmd: "{{ _decompressUtil }} {{ useImagePath }} | dd bs=4M of={{ _devicePath }} {{ _ddStatus }}"
      register: _writeResult

    - name: debug message for write image to device
      debug:
        msg:
          - "[DEBUG] *** wrote image [{{ useImagePath }}] to device [{{ _devicePath }}]..."
          - "[DEBUG] *** result is: [{{ _writeResult }}]"
      when:
        - debugFlag is defined
  vars:
    _devicePath: "{{ (useDevice | regex_search('/dev/disk\\d+')) if ansible_facts['system'] == 'Darwin' else useDevice }}"

##############################################################################
# Cleanup temporary facts (file-scoped set_fact variables)
##############################################################################
- name: Cleanup temporary facts
  set_fact:
    _decompressUtil: null
    _ddStatus: null
    _writeResult: null
    _writeImageDeviceInfo: null
