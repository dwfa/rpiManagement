##############################################################################
# Ansible inventory file
#
# USAGE:
#   Defines hosts and groups for Ansible playbooks. This file is referenced
#   in ansible.cfg as the primary inventory source.
#
# STRUCTURE:
#   all:
#     hosts:       Dictionary of individual hosts
#     children:    Dictionary of host groups
#
# HOST DEFINITION:
#   hostname:
#     ansible_host: IP address or FQDN
#     ansible_user: SSH username (optional, overrides common role default)
#     ansible_port: SSH port (optional, default 22)
#     <custom_vars>: Any additional host-specific variables
#
# GROUP DEFINITION:
#   group_name:
#     hosts:       Dictionary of hosts in this group
#     vars:        Group-level variables (optional)
#
# CUSTOMIZATION:
#   1. Replace TODO entries with your actual hosts
#   2. Define host groups based on role/function
#   3. Set host-specific variables as needed
#   4. Organize by network topology if using multiple subnets
#
# EXAMPLES:
#   See commented examples below for common patterns
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.0
# Date: October 28, 2025
##############################################################################
---

all:
  hosts:
    # Local control machine (where Ansible runs)
    localhost:
      ansible_connection: local

    # TODO: Add your Raspberry Pi hosts here
    # Example:
    # rpi-01:
    #   ansible_host: 192.168.1.100
    # rpi-02:
    #   ansible_host: 192.168.1.101

  children:
