##############################################################################
# Ansible role to detect a newly attached writable media device
#
# USAGE:
#   Detects a newly attached external device (USB drive, SD card, etc.)
#   by snapshotting before and after a user-attach prompt. Sets the
#   `installDevice` fact for downstream tasks (e.g. createRPiImage).
#
# REQUIRED VARIABLES:
#   - taskDir: Path to tasks directory
#
# OPTIONAL VARIABLES:
#   - debugFlag: Enable debug output
#
# OUTPUT VARIABLES (facts set):
#   - newDevices:    list of newly-attached /dev/... paths (transient)
#   - installDevice: single /dev/... path of the device to write to
#
# PLATFORM SUPPORT:
#   - macOS (Darwin): tasks/macOS/getInstallDevice.yaml uses diskutil
#   - Linux:          tasks/Linux/getInstallDevice.yaml uses lsblk
#   Each OS task file is responsible for: snapshot-before -> prompt ->
#   snapshot-after -> set `newDevices` fact as a normalized list of
#   /dev/... paths. This role then does the universal validation:
#   fail on 0, fail on >1, set installDevice on exactly 1.
#
# DESIGN NOTES:
#   - DRY: the "no device / one device / many devices" branching used
#     to be duplicated in both OS task files (with the 0-device case
#     silently passing). Lifted here so adding a 3rd platform only
#     requires writing the detection + normalization, not the
#     validation logic.
#   - Loose contract between this role and the OS task files: just
#     "set `newDevices` as a list of /dev/... strings."
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: May 17, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Step 1: OS-specific detection (sets `newDevices` fact)
##############################################################################
- name: Include macOS device detection
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/macOS/getInstallDevice.yaml"
  when: ansible_facts['system'] == "Darwin"

- name: Include Linux device detection
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/Linux/getInstallDevice.yaml"
  when: ansible_facts['system'] == "Linux"

##############################################################################
# Step 2: Universal validation -- newDevices must be exactly one entry
##############################################################################
- name: Fail if no new device detected
  ansible.builtin.fail:
    msg: >-
      [ERROR] *** No new device detected. Either nothing was attached
      before pressing Enter, or the device did not appear in the system
      device list. Plug the storage in and re-run the playbook.
  when: newDevices | length == 0

- name: Fail if multiple new devices detected
  ansible.builtin.fail:
    msg: >-
      [ERROR] *** Multiple new devices detected: [{{ newDevices | join(', ') }}].
      Please attach only ONE device at a time.
  when: newDevices | length > 1

##############################################################################
# Step 3: Universal selection -- promote the single match to installDevice
##############################################################################
- name: Set installDevice fact
  ansible.builtin.set_fact:
    installDevice: "{{ newDevices[0] }}"

- name: "Debug: resolved installDevice"
  ansible.builtin.debug:
    msg: "🌐 [DEBUG] *** installDevice=[{{ installDevice }}]"
  when: debugFlag | default(0) | int == 1
