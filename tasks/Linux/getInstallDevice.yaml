##############################################################################
# Linux implementation for device detection
#
# Snapshots the disk list via lsblk before and after the user attaches
# the target storage device, computes the diff, and sets `newDevices`
# as a list of /dev/... paths. Also sets `_candidateDevices` -- the
# full normalized post-attach list -- for the role's main.yaml to use
# as a whitelist when validating a manual device path (the niceInput
# fallback when the diff is not exactly 1).
#
# Universal validation + selection (fallback prompt on 0-or-many, set
# installDevice on 1) is done by roles/getInstallDevice/tasks/main.yaml
# AFTER this file returns. This file's contract: leave `newDevices`
# and `_candidateDevices` set as normalized lists.
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.1
# Date: September 11, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Validate platform compatibility
##############################################################################
- name: Fail if not running on Linux
  ansible.builtin.fail:
    msg: "[ERROR] *** This task requires Linux but running on [{{ ansible_facts['system'] }}]"
  when: ansible_facts['system'] != 'Linux'

##############################################################################
# Snapshot 1: device list BEFORE the user attaches anything
##############################################################################
- name: Get set of initial block devices
  ansible.builtin.shell:
    cmd: lsblk -d -J -o NAME,TYPE
  register: _initialBlockDevices

##############################################################################
# Pause for the user to attach the storage device
##############################################################################
- name: Ask and wait for new device to be attached
  ansible.builtin.include_tasks:
    file: "{{ taskPath }}/ui/niceWait.yaml"
  vars:
    title: "Attach external device"
    data: "Attach external device & press Enter to continue ..."

##############################################################################
# Snapshot 2: device list AFTER attachment
##############################################################################
- name: Get current block devices
  ansible.builtin.shell:
    cmd: lsblk -d -J -o NAME,TYPE
  register: _currentBlockDevices

##############################################################################
# Compute the diff and normalize to /dev/... paths. Sets two facts:
#   - newDevices:        the diff (newly-attached), for the happy path
#   - _candidateDevices: the full post-attach disk list, used by the
#                        role's main.yaml to validate a manual device
#                        path when the diff is not exactly one
##############################################################################
- name: Compute newly-attached devices and candidate list
  ansible.builtin.set_fact:
    newDevices: >-
      {{ _currentDevices | difference(_initialDevices)
                         | map('regex_replace', '^', '/dev/')
                         | list }}
    _candidateDevices: >-
      {{ _currentDevices | map('regex_replace', '^', '/dev/') | list }}
  vars:
    _initialDevices: >-
      {{ (_initialBlockDevices.stdout | from_json).blockdevices
         | selectattr('type', 'equalto', 'disk')
         | map(attribute='name') | list }}
    _currentDevices: >-
      {{ (_currentBlockDevices.stdout | from_json).blockdevices
         | selectattr('type', 'equalto', 'disk')
         | map(attribute='name') | list }}