---                                            # identifies a YAML config file

# Webmin's upstream apt repo (tasks/system/setupAPTRepo.yaml aptRepo schema)
webminAPTRepo:
  keyURL:         https://download.webmin.com/developers-key.asc
  keyFingerprint: 7D1AE915F3DCFADA344A4FCB2D223B918916F2A2
  keyName:        webmin.gpg
  repoLine: >-
    deb [signed-by=/etc/apt/keyrings/webmin.gpg]
    https://download.webmin.com/download/newkey/repository stable contrib
  filename:       webmin

webminPackages:
  - webmin
  - libxml-parser-perl          # XML::Parser, needed by Webmin's XML-RPC API
