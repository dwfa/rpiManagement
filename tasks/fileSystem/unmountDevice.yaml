##############################################################################
# Ansible task to unmount all partitions on a device
#
# USAGE:
#   Unmounts all mounted partitions on a specified block device.
#   Idempotent: succeeds gracefully if device not mounted.
#   Supports macOS and Linux.
#
# REQUIRED VARIABLES:
#   - device: Device path (e.g., /dev/disk4)
#
# OPTIONAL VARIABLES:
#   - debugFlag: Enable debug output
#
# WORKFLOW:
#   1. Validate platform (macOS or Linux)
#   2. Unmount all partitions on device:
#      - macOS: diskutil unmountDisk (single command)
#      - Linux: lsblk to find mounted partitions, loop unmount each
#   3. Handle errors:
#      - Success if already unmounted (idempotent)
#      - Fail only on real errors (busy, permissions, etc.)
#   4. Display status (debug mode only)
#   5. Cleanup temporary variables
#
# EXAMPLE:
#   - name: Unmount device before writing image
#     include_tasks:
#       file: "{{ taskDir }}/fileSystem/unmountDevice.yaml"
#     vars:
#       device: "{{ installDevice }}"
#
# NOTES:
#   - macOS: Uses `diskutil unmountDisk` to unmount all partitions
#   - Linux: Uses `lsblk -J` to find partitions, loops with unmountPartition.yaml
#   - Idempotent: Success whether device mounted or not
#   - Only fails on real errors (busy, permissions, device not found)
#   - Required before writing images with dd to prevent "device busy" errors
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: January 27, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Validate platform is supported
##############################################################################
- name: Validate platform is supported
  ansible.builtin.fail:
    msg: "[ERROR] *** Platform [{{ ansible_facts['system'] }}] not supported for unmountDevice."
  when: ansible_facts['system'] not in ['Darwin', 'Linux']

##############################################################################
# Validate device is a diskutil-style external physical descriptor (macOS).
#
# Expected input shape (from `diskutil list external`):
#   /dev/diskN (external, physical):
#
# Defence-in-depth: even if the producer of `device` promises a clean path,
# this consumer refuses to run `diskutil unmountDisk` unless the input
# clearly identifies an external physical device. Fails loudly with the
# raw value and the specific checks that failed.
##############################################################################
- name: Validate device descriptor (macOS)
  ansible.builtin.fail:
    msg: >-
      [ERROR] *** Refusing to unmount [{{ device }}] — not a valid macOS
      external physical device descriptor.
      Missing checks: {{ _missing | join(', ') }}.
      Expected shape: "/dev/diskN (external, physical):"
  vars:
    _lower:    "{{ device | lower }}"
    _hasPath:  "{{ device is match('.*/dev/disk\\d+.*') }}"
    _hasExt:   "{{ 'external' in _lower }}"
    _hasPhys:  "{{ 'physical' in _lower }}"
    _missing: >-
      {{ (['/dev/diskN'] if not _hasPath else [])
         + (['external']  if not _hasExt  else [])
         + (['physical']  if not _hasPhys else []) }}
  when:
    - ansible_facts['system'] == 'Darwin'
    - not (_hasPath and _hasExt and _hasPhys)

##############################################################################
# Unmount all partitions on device (macOS)
# _devicePath is extracted from the validated descriptor at task scope so it
# does not leak past this task.
##############################################################################
- name: Unmount all partitions on device (macOS)
  ansible.builtin.command:
    argv:
      - diskutil
      - unmountDisk
      - "{{ _devicePath }}"
  vars:
    _devicePath: "{{ device | regex_search('/dev/disk\\d+') }}"
  register: _unmountDeviceResult
  failed_when:
    - _unmountDeviceResult.rc != 0
    - "'not mounted' not in _unmountDeviceResult.stderr | lower"
    - "'already unmounted' not in _unmountDeviceResult.stderr | lower"
  changed_when: _unmountDeviceResult.rc == 0
  when: ansible_facts['system'] == 'Darwin'

- name: Display unmount status (macOS)
  debug:
    msg: "[DEBUG] *** Unmounted all partitions on device [{{ device }}]"
  when:
    - debugFlag is defined
    - ansible_facts['system'] == 'Darwin'
    - _unmountDeviceResult is changed

##############################################################################
# Unmount all partitions on device (Linux)
# Note: Linux lacks a single "unmount all" command like diskutil unmountDisk
# Strategy: Query mounted partitions via lsblk, loop and unmount each
##############################################################################
- name: Get mounted partitions on device (Linux)
  ansible.builtin.shell:
    cmd: lsblk -J -o NAME,MOUNTPOINT {{ device }}
  register: _lsblkResult
  changed_when: false
  when: ansible_facts['system'] == 'Linux'

- name: Extract mounted partitions list (Linux)
  set_fact:
    _mountedPartitions: >-
      {{ (_lsblkResult.stdout | from_json).blockdevices[0].children | default([])
         | selectattr('mountpoint', 'ne', none) | list }}
  when: ansible_facts['system'] == 'Linux'

- name: Unmount each mounted partition (Linux)
  include_tasks:
    file: "{{ taskDir }}/fileSystem/unmountPartition.yaml"
  vars:
    mountPoint: "/dev/{{ item.name }}"
  loop: "{{ _mountedPartitions }}"
  loop_control:
    label: "/dev/{{ item.name }}"
  when:
    - ansible_facts['system'] == 'Linux'
    - _mountedPartitions | length > 0

- name: Display unmount status (Linux)
  debug:
    msg: >-
      {{ '[DEBUG] *** Unmounted [' + (_mountedPartitions | length | string) +
         '] partitions on device [' + device + ']'
           if _mountedPartitions | length > 0 else
         '[DEBUG] *** No mounted partitions found on device [' + device + ']' }}
  when:
    - debugFlag is defined
    - ansible_facts['system'] == 'Linux'

##############################################################################
# Cleanup temporary facts
##############################################################################
- name: Cleanup temporary facts
  set_fact:
    _lsblkResult: null
    _mountedPartitions: null
    _unmountDeviceResult: null
