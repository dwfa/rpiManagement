##############################################################################
# Discover users and load their secret (vault-encrypted) data
#
# USAGE:
#   Called from a localhost play where vault decryption works at the
#   task level. Discovers user subdirectories and loads vault-encrypted
#   user.yaml files. Produces a map of per-user data.
#
# REQUIRED VARIABLES:
#   - usersDir: Base directory containing user subdirectories
#               (each must have a user.yaml with userData key)
#
# OPTIONAL VARIABLES:
#   - debugFlag: Enable debug output
#
# OUTPUT VARIABLES:
#   - defaultUsersData: Map of username -> full userData (for backward
#                       compat with createUser map mode)
#
# WORKFLOW:
#   1. Discover user subdirectories via discoverDirs
#   2. Load each user's user.yaml (vault decrypted on localhost)
#   3. Cleanup intermediate variables
#
# EXAMPLE:
#   - name: Load default users' secret data
#     include_tasks:
#       file: "{{ taskDir }}/users/loadUserSecrets.yaml"
#     vars:
#       usersDir: "{{ dataDir }}/users/default"
#
# NOTES:
#   - Must run on localhost (vault decryption requirement)
#   - defaultUsersData preserved for Play 2 backward compatibility
#     until createUser is refactored to use usersSecretData
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.1
# Date: March 21, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Step 1: Discover users
##############################################################################
- name: Discover users
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/files/discoverDirs.yaml"
  vars:
    searchDir: "{{ usersDir }}"

##############################################################################
# Step 2: Load each user's vault-encrypted data
##############################################################################
- name: Load user data for each discovered user
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/users/helper/loadUserData.yaml"
  loop:   "{{ discoveredDirs }}"
  loop_control:
    loop_var: _userName
  when: discoveredDirs | length > 0

- name: "Debug loaded user data [{{ item }}]"
  ansible.builtin.debug:
    msg: >-
      [DEBUG] *** User [{{ item }}]
      {%- for k in (defaultUsersData[item].keys() | sort) %}
      {{ k }}=[{{
        ('set' if (defaultUsersData[item][k] | default('')
                     | string | length > 0)
                else 'empty')
          if k == 'pwd1'
          else (defaultUsersData[item][k] | string) }}]
      {%- endfor %}
  loop: "{{ defaultUsersData.keys() | list | sort }}"
  when: debugFlag | default(0) | int == 1 and
        defaultUsersData is defined

##############################################################################
# Cleanup temporary facts
##############################################################################
- name: Cleanup temporary facts
  ansible.builtin.set_fact:
    discoveredDirs: null