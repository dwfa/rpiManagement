# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 3.0
# Date: May 17, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Play 1: Validate prerequisites and load credentials on the controller
##############################################################################
- name: Prepare local resources
  hosts:        localhost
  connection:   local
  gather_facts: false

  pre_tasks:
    ##########################################################################
    # Fail fast if the wildcard cert isn't on disk — it's a hard
    # prerequisite for nginx configure on the target. Generate it via
    # playbooks/managePKI-pb.yaml before running this playbook.
    ##########################################################################
    - name: Verify wildcard cert exists
      ansible.builtin.stat:
        path: "{{ dataDir }}/pki/wildcard.{{ domain }}.key"
      register: _cdsWildcardKeyStat

    - name: Fail if wildcard cert is missing
      ansible.builtin.fail:
        msg: >-
          [ERROR] *** Wildcard cert/key not found at
          [{{ dataDir }}/pki/wildcard.{{ domain }}.key].
          Run [./managePKI.sh] first to generate the internal CA +
          wildcard cert.
      when: not _cdsWildcardKeyStat.stat.exists

  roles:
    - role: prepareRemoteCredentials
      vars:
        userDataPath: "{{ dataDir }}/users/dwfa/user.yaml"

##############################################################################
# Play 2: Provision DNS server services on the target host
##############################################################################
- name: Provision DNS server services
  hosts:        "{{ nodes }}"
  become:       true
  gather_facts: true

  # Load remote connection vars (connectionKey.yaml or connectionPWD.yaml)
  vars_files:
    - "{{ playbook_dir }}/vars/connection{{ hostvars['localhost'].userData.file }}.yaml"

  roles:
    # - role: createUsers
    #   vars:
    #     userNames:
    #       - dwfa
    #       - wwwAdmin
    - role: configureBaseRPi
    # - role: installPackages
    # - role: installPackages
    #   vars:
    #     packageList:
    #       - nginx-core
    #       - nginx
    #       - bind9
    #       - bind9utils
    #       - dnsutils
    #       - isc-dhcp-server
    #       - webmin
    # Pi-hole is native (see BACKLOG "Revisit containerized pi-hole").
    # Not an apt package, so it does not flow through installPackages.
    # - role: pihole

  post_tasks:
    ##########################################################################
    # Once all manageable services have been installed and configured,
    # restart webmin so its module-detection re-scan picks up newcomers
    # (e.g., the BIND DNS Server module after bind9 lands).
    ##########################################################################
    - name: Restart webmin so it auto-detects newly-installed modules
      ansible.builtin.systemd:
        name:  webmin
        state: restarted

##############################################################################
# Play 3: Cleanup materialized SSH keys on the controller
##############################################################################
- name: Cleanup materialized SSH keys
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - clearLocal