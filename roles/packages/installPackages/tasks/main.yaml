##############################################################################
# Install (and auto-configure) one or more packages
#
# USAGE:
#   Generic role for installing apt packages and auto-running any
#   matching per-package configure task. Caller may pass packageList
#   to override the default; otherwise basePackageList from
#   vars/main.yaml (vim, zsh, fish today) is used.
#
#   The configure auto-discovery looks up tasks/<packageName>/configure.yaml
#   for each entry in the install list. When the apt package name and
#   the configure-task directory name match (e.g. nginx → tasks/nginx/),
#   no extra plumbing is needed. When they diverge (e.g. apt names are
#   bind9/bind9utils/dnsutils but configure lives at tasks/bind/),
#   handle the configure step at the call site instead of relying on
#   this role's auto-discovery.
#
# REQUIRED VARIABLES:
#   None.
#
# OPTIONAL VARIABLES:
#   - packageList: Override list of apt package names to install. When
#                  unset, defaults to basePackageList from vars/main.yaml.
#   - packageVars: Per-package vars for the configure step, as a map
#                  {packageName: {var: value, ...}}. Each entry is
#                  scoped by configurePackage.yaml to that package's
#                  configure.yaml only (via include_tasks.apply.vars),
#                  so vars set for one package never leak into
#                  another's configure step. Example:
#                    packageVars:
#                      nut:  { nutRole: server }
#   - debugFlag:   Enable debug output
#
# WORKFLOW:
#   1. Resolve effective package list (packageList override OR default)
#   2. Install all packages in one apt call via tasks/system/installPackage.yaml
#   3. For each package, call tasks/system/configurePackage.yaml — which
#      stats tasks/<package>/configure.yaml and includes it if present
#
# EXAMPLE:
#   # Use the default base list (vim, zsh, fish)
#   - hosts: "{{ nodes }}"
#     become: true
#     roles:
#       - installPackages
#
#   # Install nginx (configure auto-discovered at tasks/nginx/configure.yaml)
#   - hosts: "{{ nodes }}"
#     become: true
#     roles:
#       - role: installPackages
#         vars:
#           packageList: [nginx-core, nginx]
#
# NOTES:
#   - Must run in a remote play (apt requires the target host)
#   - To change what counts as "base," edit vars/main.yaml
#   - Per-package configuration is auto-discovered: drop a
#     tasks/<package>/configure.yaml and it runs automatically; remove
#     the file and it stops. No role changes required.
#   - 3rd-party apt repos are not handled here; the package's own role
#     calls tasks/system/setupAPTRepo.yaml
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.3
# Date: October 15, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Resolve the effective package list (caller override OR default)
##############################################################################
- name: Resolve effective package list
  ansible.builtin.set_fact:
    _ipPackageList: "{{ packageList | default(basePackageList) }}"

##############################################################################
# Install all packages in one apt call
##############################################################################
- name: Install packages
  ansible.builtin.include_tasks:
    file: "{{ taskPath }}/system/installPackage.yaml"
  vars:
    packageList: "{{ _ipPackageList }}"

##############################################################################
# Auto-configure each package if it has a configure.yaml on the
# controller. configurePackage handles the discovery (stat + conditional
# include) per package.
##############################################################################
- name: Auto-configure each package
  ansible.builtin.include_tasks:
    file: "{{ taskPath }}/system/configurePackage.yaml"
  vars:
    packageName:          "{{ pkgIdx }}"
    # Per-package caller-supplied vars, if any. packageVars is an
    # optional {packageName: {var: value}} map passed by the caller;
    # configurePackage.yaml scopes these to the included configure
    # file only (via include_tasks.apply.vars) so they never leak
    # into other packages' configure steps.
    packageConfigureVars: "{{ (packageVars | default({})).get(pkgIdx, {}) }}"
  loop: "{{ _ipPackageList }}"
  loop_control:
    loop_var: pkgIdx
    label:    "{{ pkgIdx }}"

##############################################################################
# Cleanup transient facts
##############################################################################
- name: Cleanup temporary facts
  ansible.builtin.set_fact:
    _ipPackageList: null