##############################################################################
# Resolve target host IP — try known, prompt if unreachable
#
# USAGE:
#   Runs on localhost (typically in Play 1 of a playbook, before any remote
#   play attempts SSH). Tries the target host's inventory IP first; if
#   unreachable, prompts the user for the actual (e.g. DHCP-assigned) IP.
#   Stores the resolved address as the global fact `currentIP` on localhost.
#   Subsequent remote plays reference it directly:
#       hosts: "{{ hostvars['localhost'].currentIP }}"
#
# REQUIRED VARIABLES:
#   - targetHost: Inventory host key (IP string in this project's inventory)
#                 to resolve. Typically "{{ groups[nodes] | first }}" when
#                 called from a localhost play.
#
# OPTIONAL VARIABLES:
#   - resolveTimeout: Seconds to wait for known IP   (default: 30)
#   - sshPort:        SSH port to check              (default: 22)
#   - debugFlag:      Enable debug output
#
# OUTPUT VARIABLES:
#   - currentIP: Resolved IP string (set on localhost). Either equals
#                targetHost (known IP reachable) or the user-prompted IP.
#
# WORKFLOW:
#   1. Try targetHost on sshPort with short timeout
#   2. If reachable: currentIP = targetHost
#   3. If unreachable: prompt user for DHCP-assigned IP, validate format,
#      wait for it to be reachable, set currentIP = prompted IP
#
# EXAMPLE:
#   # Play 1 (localhost)
#   pre_tasks:
#     - name: Resolve target host IP
#       include_tasks:
#         file: "{{ taskPath }}/system/resolveTargetHost.yaml"
#       vars:
#         targetHost: "{{ groups[nodes] | first }}"
#
#   # Play 2 (remote)
#   - name: Do work on RPi
#     hosts: "{{ hostvars['localhost'].currentIP }}"
#     ...
#
# NOTES:
#   - Must be called from a localhost play (no SSH attempted to the target)
#   - Simple regex validation on the prompted IP (loose but sufficient)
#   - Dynamic DHCP lease discovery is deferred; prompt is the only fallback
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.2
# Date: April 15, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Validate required parameter
##############################################################################
- name: Validate targetHost is provided
  ansible.builtin.fail:
    msg: "[ERROR] *** targetHost is required for resolveTargetHost task"
  when: targetHost is not defined

##############################################################################
# Try known IP (targetHost) with short timeout.
# Delegates to the shared waitForHost task so the underlying probe
# mechanism lives in one place.
##############################################################################
- name: Try known IP [{{ targetHost }}]
  include_tasks: "{{ taskPath }}/system/waitForHost.yaml"
  vars:
    waitHost:    "{{ targetHost }}"
    waitPort:    "{{ sshPort        | default(22) }}"
    waitTimeout: "{{ resolveTimeout | default(5) }}"

# Snapshot hostReachable before the fallback block overwrites it.
- name: Snapshot known-IP reachability
  ansible.builtin.set_fact:
    _rthKnownIPReachable: "{{ hostReachable }}"

##############################################################################
# Known IP reachable — set currentIP to targetHost
##############################################################################
- name: Set currentIP to known IP
  ansible.builtin.set_fact:
    currentIP: "{{ targetHost }}"
  when: _rthKnownIPReachable

##############################################################################
# Fallback: prompt user and set currentIP when known IP unreachable
##############################################################################
- name: Resolve via user prompt
  block:
    - name: Prompt for DHCP-assigned IP
      ansible.builtin.include_role:
        name: niceInput
      vars:
        title: "Enter DHCP-assigned IP"
        data: |-
          Host [{{ targetHost }}] not reachable on port {{ sshPort | default(22) }}.
          Enter the DHCP-assigned IP for this host.

    - name: Validate prompted IP format
      ansible.builtin.fail:
        msg: "[ERROR] *** Invalid IPv4 format: [{{ promptValue }}]"
      when: not (promptValue | regex_search('^([0-9]{1,3}\.){3}[0-9]{1,3}$'))

    - name: Set currentIP to prompted IP
      ansible.builtin.set_fact:
        currentIP: "{{ promptValue }}"

    - name: Wait for resolved host to be reachable
      include_tasks: "{{ taskPath }}/system/waitForHost.yaml"
      vars:
        waitHost:    "{{ currentIP }}"
        waitPort:    "{{ sshPort        | default(22) }}"
        waitTimeout: "{{ resolveTimeout | default(30) }}"

    - name: Fail if prompted host still not reachable
      ansible.builtin.fail:
        msg: "[ERROR] *** Prompted host [{{ currentIP }}] not reachable on port [{{ sshPort | default(22) }}]."
      when: not hostReachable
  when: not _rthKnownIPReachable

##############################################################################
# Register resolved target in runtime inventory so subsequent plays can
# reference it via `hosts: "{{ hostvars['localhost'].currentIP }}"`.
# Ansible's hosts: directive only matches hosts that exist in inventory;
# add_host creates an entry for the resolved IP at runtime.
##############################################################################
- name: Add resolved target to runtime inventory
  ansible.builtin.add_host:
    name:   "{{ currentIP }}"
    groups: resolved

##############################################################################
# Debug resolved target
##############################################################################
- name: Debug resolved target
  ansible.builtin.debug:
    msg: "[DEBUG] *** Target [{{ targetHost }}] resolved to [{{ currentIP }}]"
  when: debugFlag | default(0) | int == 1

##############################################################################
# Cleanup temporary facts
##############################################################################
- name: Cleanup temporary facts
  ansible.builtin.set_fact:
    _rthKnownIPResult: null
    _rthPrompt:        null
