##############################################################################
# Ansible role to download and manage RPi OS images
#
# USAGE:
#   Downloads and maintains RPi OS images in dataDir/images/ directory.
#   Should run on localhost (controller machine) where data/ directory exists.
#
# REQUIRED VARIABLES:
#   - taskDir: Path to tasks directory (inherited from common role)
#   - dataDir: Path to data directory (inherited from common role)
#
# OUTPUT VARIABLES:
#   - imagePath: Path to current RPi OS image (symlink to decompressed image)
#
# NOTES:
#   - Designed to run on localhost; displays warning if run on remote host
#   - Images stored in dataDir/images/ on controller machine
#   - For remote targets, createRPiImage handles copying image to target
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: February 01, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Warn if not running on localhost (allow override but inform user)
##############################################################################
- name: Warn if not running on localhost
  debug:
    msg: >-
      [WARNING] *** updateRPiImage is designed to run on localhost.
      Running on [{{ inventory_hostname }}] may cause unexpected behavior.
  when: inventory_hostname != 'localhost'

##############################################################################
# Download and manage RPi image
##############################################################################
- name: Include task to download/manage RPi image
  include_tasks:
    file: "{{ taskDir }}/rpi/manageImage.yaml"
