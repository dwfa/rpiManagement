##############################################################################
# Configure bind: render zone files + named.conf.{local,options} from
# the canonical network inventory (produced by netGen).
#
# USAGE:
#   Loads daemon + domain config from data/packages/bind9/metadata.yaml,
#   parses the canonical network JSON via the networkInventory module,
#   renders the forward zone (one file, all hosts) and the reverse zone
#   (one file for the /16, all hosts), validates with named-checkzone +
#   named-checkconf, reloads bind9.
#
# REQUIRED VARIABLES:
#   None at the call site. Driven by data/packages/bind9/metadata.yaml
#   and the rendered inventory under data/network/inventory.xlsx.
#
# OPTIONAL VARIABLES:
#   - debugFlag: Enable debug output
#
# WORKFLOW:
#   1. Load metadata (domain, primaryNS, adminContact, listen, etc.)
#   2. Call networkInventory module → canonical JSON document
#      (delegated to controller; --strict so data-quality issues fail fast)
#   3. Alias metadata.subnets as zoneSubnets for clarity
#   4. Render forward zone → /etc/bind/db.<domain>
#   5. Render reverse zone → /etc/bind/db.<network-prefix>
#      (single file — the entire 192.168.0.0/16 reverse zone)
#   6. Render named.conf.local declaring forward + reverse zones
#   7. Render named.conf.options (daemon-level config)
#   8. Validate every rendered zone with named-checkzone, then validate
#      the overall config with named-checkconf — fail loudly on errors
#   9. Reload bind9 (graceful — existing connections survive)
#
# EXAMPLE:
#   - include_tasks: "{{ taskPath }}/bind/configure.yaml"
#
# NOTES:
#   - Zone files are owned root:bind 0644 so bind can read them
#   - SOA serial is the controller's epoch at render time — strictly
#     monotonic, which is all bind cares about for replication
#   - Single /16 reverse zone matches the actual broadcast domain. The
#     Excel sheets organize hosts by third octet for human readability,
#     but bind sees one /16
#   - reload (not restart) so existing query connections survive
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: May 9, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Step 1: Load metadata
##############################################################################
- name: Load bind configuration manifest
  ansible.builtin.include_vars:
    file: "{{ dataPath }}/packages/bind9/metadata.yaml"

##############################################################################
# Step 2: Parse the canonical network inventory on the controller.
# Shared task -- cached as `netInventory` for the play, so a multi-
# service run (bind9 + isc-dhcp + pi-hole) parses the Excel once.
##############################################################################
- name: Ensure network inventory is parsed
  ansible.builtin.include_tasks: "{{ taskPath }}/network/parseInventory.yaml"

##############################################################################
# Step 3: Alias metadata.subnets as zoneSubnets for the templates
##############################################################################
- name: Alias zone subnets
  ansible.builtin.set_fact:
    zoneSubnets: "{{ netInventory.metadata.subnets }}"

##############################################################################
# Step 4: Render the forward zone file (all named hosts)
##############################################################################
- name: Render forward zone
  ansible.builtin.template:
    src:   "{{ dataPath }}/packages/bind9/templates/forward.j2"
    dest:  "{{ zoneDir }}/db.{{ domain }}"
    owner: root
    group: bind
    mode:  '0644'
  vars:
    zoneHosts: "{{ netInventory.hosts }}"
    subnet: "{{ zoneSubnets[0] }}"

##############################################################################
# Step 5: Render the reverse zone file (one file for the /16)
##############################################################################
- name: Render reverse zone
  ansible.builtin.template:
    src:   "{{ dataPath }}/packages/bind9/templates/reverse.j2"
    dest:  "{{ zoneDir }}/db.{{ zoneSubnets[0].subnetPrefix }}"
    owner: root
    group: bind
    mode:  '0644'
  vars:
    zoneHosts: "{{ netInventory.hosts }}"
    subnet: "{{ zoneSubnets[0] }}"

##############################################################################
# Step 6: Render named.conf.local (zone declarations)
##############################################################################
- name: Render named.conf.local
  ansible.builtin.template:
    src:    "{{ dataPath }}/packages/bind9/templates/named.conf.local.j2"
    dest:   /etc/bind/named.conf.local
    owner:  root
    group:  bind
    mode:   '0644'
    backup: true

##############################################################################
# Step 7: Render named.conf.options (daemon-level config)
##############################################################################
- name: Render named.conf.options
  ansible.builtin.template:
    src:    "{{ dataPath }}/packages/bind9/templates/named.conf.options.j2"
    dest:   /etc/bind/named.conf.options
    owner:  root
    group:  bind
    mode:   '0644'
    backup: true

##############################################################################
# Step 8a: Validate every rendered zone file
##############################################################################
- name: Validate forward zone
  ansible.builtin.command:
    cmd: "named-checkzone {{ domain }} {{ zoneDir }}/db.{{ domain }}"
  changed_when: false

- name: Validate reverse zone
  ansible.builtin.command:
    cmd: "named-checkzone {{ zoneSubnets[0].reverseOrigin }} {{ zoneDir }}/db.{{ zoneSubnets[0].subnetPrefix }}"
  changed_when: false

##############################################################################
# Step 8b: Validate the overall bind configuration
##############################################################################
- name: Validate bind configuration
  ansible.builtin.command:
    cmd: named-checkconf
  changed_when: false

##############################################################################
# Step 9: Reload bind9 to pick up the new zones
##############################################################################
- name: Enable and reload bind9
  ansible.builtin.systemd:
    name:    bind9
    enabled: true
    state:   reloaded