##############################################################################
# Create Raspberry Pi image
#
# USAGE:
#   Creates RPi OS images on removable media (SD cards, USB drives).
#   Supports both local (macOS) and remote (Linux) target hosts.
#
# EXAMPLE:
#   ./createImage.sh                                    # localhost (macOS)
#   ./createImage.sh -n installer                       # remote Linux host
#   # or directly:
#   ansible-playbook --extra-vars "nodes=localhost" playbooks/createImage-pb.yaml
#   ansible-playbook --extra-vars "nodes=installer" playbooks/createImage-pb.yaml
#
# WORKFLOW:
#   Play 1 (localhost):
#     1. prepareRemoteCredentials: Load vault-encrypted credentials and
#        materialize SSH keys to data/ssh/ (skips if no keys present)
#     2. updateRPiImage: Download/update RPi OS image to data/images/
#   Play 2 (target host):
#     3. getInstallDevice: Detect single available external drive
#     4. createRPiImage: Copy image to target (if remote), write to disk
#     5. initRPiImage: Copy init files and configure boot partition
#   Play 3 (localhost):
#     6. cleanupLocal: Remove materialized SSH key files from data/ssh/
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.4
# Date: March 22, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Play 1: Load credentials, materialize SSH keys, manage image locally
# Note: updateRPiImage must run on localhost where data/ directory exists
##############################################################################
- name: Prepare local resources
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: prepareRemoteCredentials
      vars:
        userDataPath: "{{ dataDir }}/users/dwfa/user.yaml"
    - updateRPiImage

##############################################################################
# Play 2: Execute on target hosts
##############################################################################
- name: Create RPi Image
  hosts:        "{{ nodes }}"
  become:       true
  gather_facts: true

# Load remote connection vars (connectionKey.yaml or connectionPWD.yaml)
  vars_files:
    - "{{ playbook_dir }}/vars/connection{{ hostvars['localhost'].userData.file }}.yaml"

  roles:
    - role: getInstallDevice
    - role: createRPiImage
    - role: initRPiImage
      vars:
        userDataPath: "{{ dataDir }}/users/installer/user.yaml"

##############################################################################
# Play 3: Cleanup materialized SSH keys
##############################################################################
- name: Cleanup materialized SSH keys
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - cleanupLocal