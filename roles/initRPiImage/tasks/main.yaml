##############################################################################
# Ansible role to initialize RPi boot partition
#
# USAGE:
#   Initializes a freshly written RPi OS image boot partition with config files.
#   Must be called AFTER createRPiImage role which sets bootMountPoint fact.
#
# REQUIRED FACTS:
#   - bootMountPoint: Mount path for boot partition (set by createRPiImage role)
#   - taskDir: Path to tasks directory (inherited from common role)
#   - dataDir: Path to data directory (inherited from common role)
#   - debugFlag: (optional) Enable debug output
#
# WORKFLOW:
#   1. Copy initialization files (ssh, userconf.txt) to boot partition
#   2. Modify cmdline.txt with custom boot parameters
#   3. Unmount boot partition
#
# EXAMPLE:
#   - hosts: localhost
#     roles:
#       - role: getInstallDevice
#       - role: updateRPiImage
#       - role: createRPiImage    # Sets bootMountPoint fact
#       - role: initRPiImage      # Uses bootMountPoint
#
# NOTES:
#   - Requires createRPiImage to run first (sets bootMountPoint fact)
#   - Boot partition must be mounted before this role runs
#   - Files to copy defined in data/rpi/metadata.yaml
#   - cmdline.txt modifications defined in data/rpi/cmdline-txt-mods.yaml
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.0
# Date: January 04, 2026
##############################################################################
---

##############################################################################
# Copy init files to boot partition
##############################################################################
- name: Copy init files to boot partition
  include_tasks:
    file: "{{ taskDir }}/files/copyFiles.yaml"
  vars:
    metadataPath: "{{ dataDir }}/rpi/metadata.yaml"
    destDir: "{{ bootMountPoint }}"

##############################################################################
# Update boot/cmdline.txt
##############################################################################
- name: Update cmdline.txt
  include_tasks:
    file: "{{ taskDir }}/files/modifyFile.yaml"
  vars:
    filePath:     "{{ _cmdlineTxtPath }}"
    metadataPath: "{{ _cmdlineTxtModsPath }}"

##############################################################################
# Unmount boot partition
##############################################################################
- name: Unmount boot partition
  include_tasks:
    file: "{{ taskDir }}/fileSystem/unmountPartition.yaml"
  vars:
    mountPoint: "{{ bootMountPoint }}"
