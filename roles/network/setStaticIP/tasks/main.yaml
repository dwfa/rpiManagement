##############################################################################
# Set static IP on a target — thin role wrapper
#
# USAGE:
#   Thin wrapper around tasks/network/setStaticIP.yaml (which dispatches
#   between the online and offline strategies based on inputs). No
#   project-specific post-conditions — callers are expected to know the
#   target address themselves (typically via a separate targetIP fact set
#   from the same static-IP data file).
#
# REQUIRED VARIABLES:
#   - staticIPDataPath: Path to YAML file containing ipDetails
#                       (address, netmask, gateway, dns)
#
# REQUIRED VARIABLES (online strategy only):
#   - currentAddress:   Address the running target is currently reachable
#                       at. Used for idempotency.
#
# REQUIRED VARIABLES (offline strategy only):
#   - partitionDevice:  Root partition device path. Presence selects the
#                       offline strategy.
#
# OPTIONAL VARIABLES:
#   - debugFlag:        Enable debug output.
#
# EXAMPLES:
#   # Offline (during imaging)
#   - include_role:
#       name: setStaticIP
#     vars:
#       partitionDevice:  "{{ _rootPartitionDevice }}"
#       staticIPDataPath: "{{ dataPath }}/network/staticIP/installer.yaml"
#
#   # Online (running host)
#   - hosts: "{{ _currentIP }}"
#     vars:
#       _currentIP: "{{ hostvars['localhost'].currentIP }}"
#     roles:
#       - role: setStaticIP
#         vars:
#           currentAddress:   "{{ _currentIP }}"
#           staticIPDataPath: "{{ dataPath }}/network/staticIP/installer.yaml"
#
# NOTES:
#   - Strategy selection is performed inside tasks/network/setStaticIP.yaml
#     (presence of partitionDevice → offline; absence → online).
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: August 22, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Dispatch to the entry task (validates inputs, picks strategy, applies)
##############################################################################
- name: Apply static IP
  ansible.builtin.include_tasks:
    file: "{{ taskPath }}/network/setStaticIP.yaml"

##############################################################################
# Cleanup temporary facts. _ssipnChanged is also cleaned so a later
# invocation of the role in the same playbook starts from a clean slate.
##############################################################################
- name: Cleanup temporary facts
  ansible.builtin.set_fact:
    _ssipnChanged: null
  delegate_to:    localhost
  delegate_facts: true
