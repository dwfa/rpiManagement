##############################################################################
# Where RPi OS images are kept on a REMOTE build host. Images are named by
# their real release filename and kept between builds, so a later build
# with the same image skips the copy. Old images are not pruned -- manage
# them by hand.
##############################################################################
buildImageDir: /usr/local/src/rpiImages
