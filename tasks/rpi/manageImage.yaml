##############################################################################
# Ansible task for managing RPi OS image download and verification
#
# USAGE:
#   Manages the complete lifecycle of RPi OS images: checking for updates,
#   downloading, verifying checksums, and maintaining a symlink to current image.
#
# REQUIRED VARIABLES:
#   - imageDir: Directory to store images
#   - imagePath: Symlink path to current image
#   - rpiImage: Image name from RPi API (e.g., "Raspberry Pi OS Lite (64-bit)")
#   - rpiApiUrl: RPi OS catalog API URL
#   - taskDir: Path to tasks directory
#   - debugFlag: (optional) Enable debug output
#
# OUTPUT VARIABLES:
#   - imagePath: Path to current RPi OS image (symlink to decompressed image)
#       This fact is consumed by createRPiImage role via defaultImageFilePath
#
# WORKFLOW:
#   1. Check for existing local image and extract metadata
#   2. Fetch RPi OS catalog from API
#   3. Compare local vs. available image (by date and checksum)
#   4. Download if newer or different
#   5. Verify checksum of downloaded image
#   6. Create/update symlink to current image
#   7. Fallback to local image if API unavailable
#
# DOWNLOAD TRIGGERS:
#   - No local image exists
#   - Remote image has newer date
#   - Same date but different checksum (updated release)
#
# EXAMPLE:
#   - name: Update RPi OS image
#     include_tasks:
#       file: "{{ taskDir }}/rpi/manageImage.yaml"
#
# NOTES:
#   - Images are downloaded compressed (.xz) then decompressed
#   - Symlink (imagePath) points to decompressed image for faster access
#   - Gracefully handles API failures with user confirmation
#   - Checksums verified against official RPi Foundation values
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.7
# Date: October 18, 2025
##############################################################################
---                                            # identifies a YAML config file

- name: Ensure image directory exists
  file:
    path: "{{ imageDir }}"
    state: directory
    mode: '0755'

##############################################################################
# Check for existing local image and extract metadata
##############################################################################
- name: Get local image info
  block:
    - name: Get symlink metadata
      stat:
        path: "{{ imagePath }}"
        follow: no
      register: _symlinkStat

    - name: Get actual file checksum
      stat:
        path: "{{ imagePath }}"
        checksum_algorithm: sha256
        get_checksum: yes
        follow: yes
      register: _fileStat
      when: _symlinkStat.stat.exists

    - name: Extract current image metadata
      set_fact:
        _currentImage:
          exists: "{{ _symlinkStat.stat.exists }}"
          filename: "{{ _symlinkStat.stat.lnk_target | basename if (_symlinkStat.stat.islnk | default(false)) else (imagePath | basename) }}"
          date: "{{ ((_symlinkStat.stat.lnk_target | basename if (_symlinkStat.stat.islnk | default(false)) else (imagePath | basename)) | regex_search('^\\d{4}-\\d{2}-\\d{2}')) }}"
          checksum: "{{ _fileStat.stat.checksum | default('') }}"
          path: "{{ imagePath }}"
      when: _symlinkStat.stat.exists

    - name: Display local image file status
      debug:
        msg: >-
          {{ '[DEBUG] *** Local image exists: [' + imagePath + '] w/' +
             '\n\t date [' + _currentImage.date + ']' +
             '\n\t checksum: [' + _currentImage.checksum + ']'
               if _currentImage.exists | default(false) else
             '[DEBUG] *** Local image not found: [' + imagePath + ']' }}
      when: debugFlag is defined

##############################################################################
# Fetch RPi OS catalog from API and extract image metadata
##############################################################################
- name: Fetch and process RPi OS catalog
  block:
    - name: Fetch RPi OS catalog info from API
      uri:
        url: "{{ rpiApiUrl }}"
        return_content: yes
        timeout: 30
      register: _rpiOsCatalog

    - name: Display search results
      debug:
        msg: >-
          {{ '[DEBUG] *** Found [' + _matchingImages | length | string + '] RPi images'
               if (_matchingImages | length) > 0 else
             '[DEBUG] *** Did not find a matching RPi image!' }}
      when: debugFlag is defined

    - name: Validate image metadata
      assert:
        that:
          - _matchingImages | length > 0
          - _matchingImages[0].url is defined
          - _matchingImages[0].extract_sha256 is defined
        fail_msg: >-
          RPi image [{{ rpiImage }}] not found or missing required fields.
          Check available variants at [{{ rpiApiUrl }}]
        success_msg: "RPi image [{{ rpiImage }}] validated successfully"

    - name: Extract image metadata
      set_fact:
        _newImage:
          url: "{{ _matchingImages[0].url }}"
          checksum: "{{ _matchingImages[0].extract_sha256 }}"
          filename: "{{ _matchingImages[0].url | basename }}"
          date: "{{ (_matchingImages[0].url | basename) | regex_search('^\\d{4}-\\d{2}-\\d{2}') }}"

    - name: Display extracted metadata
      debug:
        msg:
          - "[DEBUG] *** RPi Image found: [{{ rpiImage }}]"
          - "[DEBUG] *** Image filename: [{{ _newImage.filename }}]"
          - "[DEBUG] *** Published checksum: [{{ _newImage.checksum }}]"
          - "[DEBUG] *** Download URL: [{{ _newImage.url }}]"
      when:
        - debugFlag is defined
        - _newImage.checksum is defined
  vars:
    _matchingImages: >-
      {{ _rpiOsCatalog.json.os_list
         | selectattr('subitems', 'defined')
         | map(attribute='subitems')
         | flatten
         | selectattr('name', 'equalto', rpiImage)
         | list }}
  rescue:
    - name: Display API fetch failure
      debug:
        msg:
          - "[WARNING] *** API fetch failed"
          - "[WARNING] *** Error: [{{ ansible_failed_result.msg | default('Unknown error') }}]"
          - "[WARNING] *** Checking for last known good local image"

    - name: Fail if no fallback available
      fail:
        msg: >-
          Failed to fetch RPi OS catalog and no valid local image exists.
          Error: [{{ ansible_failed_result.msg | default('Unknown error') }}]
          Check network connectivity and API availability.
      when: not (_currentImage.exists | default(false)) or not _currentImage.checksum

    - name: Display LKG information
      debug:
        msg:
          - "[INFO] *** Last known good image available"
          - "[INFO] *** Path: [{{ imagePath }}]"
          - "[INFO] *** Checksum: [{{ _currentImage.checksum }}]"
      when: debugFlag is defined

    - name: Prompt user for fallback decision
      include_tasks:
        file: "{{ taskDir }}/misc/niceWait.yaml"
      vars:
        title: "Use last known good image"
        data: |

          ============================================================
          WARNING: Cannot fetch latest RPi OS image from API

          Last Known Good Image Available:
            Path: {{ imagePath }}
            Checksum: {{ _currentImage.checksum }}

          Press Enter to use this image, or Ctrl+C then 'A' to abort
          ============================================================

##############################################################################
# Determine if download is needed based on version comparison
##############################################################################
- name: Display download decision
  debug:
    msg: >-
      {{ '[DEBUG] *** Download needed: NO - Using fallback (API unavailable)'
           if _newImage.date is not defined else
         '[DEBUG] *** Download needed: YES - Local image file does not exist'
           if not (_currentImage.exists | default(false)) else
         '[DEBUG] *** Download needed: YES - image out of date [' +
           (_currentImage.date | default('undefined')) +
           '] < New date [' + _newImage.date + ']'
           if _currentImage.date is defined and _currentImage.date < _newImage.date else
         '[DEBUG] *** Download needed: YES - checksum mismatch (same date [' +
           _newImage.date + '] but checksum differs)'
           if _currentImage.date is defined and _currentImage.date == _newImage.date and
              _currentImage.checksum != _newImage.checksum else
         '[DEBUG] *** Download needed: NO - local image is current' }}
  when: debugFlag is defined

##############################################################################
# Download, decompress, verify, and symlink new RPi OS image
##############################################################################
- name: Download and verify RPi OS image
  block:
    - name: Announce download start
      debug:
        msg:
          - "[DEBUG] *** Starting download..."
          - "[DEBUG] *** Source: [{{ _newImage.url }}]"
          - "[DEBUG] *** Destination: [{{ _dlImagePath }}]"
      when:
        - debugFlag is defined

    - name: Download RPi OS image
      get_url:
        url: "{{ _newImage.url }}"
        dest: "{{ _dlImagePath }}"
        mode: '0644'
      register: _downloadResult

    - name: Display download completion
      debug:
        msg:
          - "[DEBUG] *** Download completed successfully"
          - "[DEBUG] *** File: [{{ _dlImagePath }}]"
          - "[DEBUG] *** Size: [{{ (_downloadResult.msg | default('') | regex_search('(\\d+) bytes') | default('unknown')) }}]"
          - "[DEBUG] *** Elapsed time: [{{ _downloadResult.elapsed | default(0) }}s]"
      when:
        - debugFlag is defined

    - name: Remove existing decompressed image if present
      file:
        path: "{{ _decompressedImagePath }}"
        state: absent

    - name: Decompress RPi OS image
      command: unxz "{{ _dlImagePath }}"

    - name: Calculate checksum of decompressed image
      stat:
        path: "{{ _decompressedImagePath }}"
        checksum_algorithm: sha256
        get_checksum: yes
      register: _decompressedChecksum

    - name: Validate decompressed image checksum
      fail:
        msg: >-
          Checksum mismatch!
          Expected: {{ _newImage.checksum }}
          Got: {{ _decompressedChecksum.stat.checksum }}
      when:
        - _decompressedChecksum.stat.checksum != _newImage.checksum

    - name: Create/update link to current image
      file:
        src: "{{ _decompressedImagePath }}"
        dest: "{{ imagePath }}"
        state: link
        force: yes
  vars:
    _needsDownload: >-
      {{ (_newImage.date is defined and _newImage.checksum is defined) and
         (not (_currentImage.exists | default(false)) or
          _newImage.date > _currentImage.date or
          (_newImage.date == _currentImage.date and _currentImage.checksum != _newImage.checksum)) }}
    _dlImagePath: "{{ imageDir }}/{{ _newImage.filename }}"
    _decompressedImagePath: "{{ imageDir }}/{{ _newImage.filename | regex_replace('\\.xz$', '') }}"
  rescue:
    - name: Clean up failed download
      file:
        path: "{{ _dlImagePath }}"
        state: absent
      ignore_errors: yes

    - name: Display download error
      fail:
        msg: >-
          Failed to download RPi OS image from [{{ _newImage.url }}].
          Error: [{{ ansible_failed_result.msg | default('Download failed') }}]
  when: _needsDownload

- name: Display final image path
  debug:
    msg: "[DEBUG] *** Image ready at: [{{ imagePath }}]"
  when: debugFlag is defined

##############################################################################
# Cleanup temporary facts (file-scoped and block-scoped set_fact variables)
##############################################################################
- name: Cleanup temporary facts
  set_fact:
    _symlinkStat: null
    _fileStat: null
    _currentImage: null
    _rpiOsCatalog: null
    _newImage: null
    _downloadResult: null
    _decompressedChecksum: null
