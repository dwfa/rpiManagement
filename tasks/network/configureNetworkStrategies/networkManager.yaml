##############################################################################
# configureNetwork strategy: NetworkManager
#
# NetworkManager (the default on modern RPi OS / Ubuntu Desktop). Groups
# nwAliases by interface and runs helper/addNetworkManagerAddresses.yaml
# once per interface. The helper finds the interface's profile (creating
# lo-aliases for lo if it has none), adds any missing addresses, and
# brings the profile up only if something changed.
#
# INPUT: nwAliases (see tasks/network/configureNetwork.yaml)
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.2
# Date: October 4, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# One helper run per interface in nwAliases
##############################################################################
- name: Add addresses per interface via NetworkManager
  ansible.builtin.include_tasks:
    file: "{{ taskPath }}/network/configureNetworkStrategies/helper/addNetworkManagerAddresses.yaml"
  vars:
    nmInterface: "{{ ifaceIdx }}"
    nmAddresses: >-
      {{ nwAliases | selectattr('interface', 'equalto', ifaceIdx)
         | map(attribute='address') | list }}
  loop: "{{ nwAliases | default([]) | map(attribute='interface') | unique | list }}"
  loop_control:
    loop_var: ifaceIdx
