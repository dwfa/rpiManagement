##############################################################################
# Create a single user account from a vault-encrypted user.yaml file
#
# USAGE:
#   Loads user credentials, ensures referenced groups (primary +
#   supplementary) exist on the target host, creates the user account,
#   sets home directory permissions, installs public SSH keys, and
#   installs any per-user files staged in the sibling files/ directory.
#   Password is hashed and trimmed inline. Singular form — see
#   createUsers.yaml for the directory-scan / list wrapper.
#
# REQUIRED VARIABLES (exactly one of):
#   - userDataPath: Explicit path to a vault-encrypted user.yaml file
#   - uName:        Username; user.yaml is found by convention at
#                   "{{ dataDir }}/users/<uName>/user.yaml"
#
#   user.yaml's userData dict must contain: uName, uid, name, shell,
#   primaryGroup (list with one {name, gid}), supplementaryGroups
#   (list of {name, gid?}).
#
# OPTIONAL user.yaml FIELDS:
#   - userData.pwd:             Vault-encrypted password. If absent or
#                               empty, the account is created with NO
#                               password (locked) — suitable for
#                               service accounts.
#   - userData.createHome:      Whether to create /home/<uName>.
#                               Default: true. Set to false for service
#                               accounts that don't need a home dir.
#   - userData.homeMode:        Home dir mode. Default '0755' (overrides
#                               Debian's restrictive 0700 default).
#                               Ignored when createHome is false.
#   - userData.shell:           Login shell. Default '/bin/bash'. Use
#                               '/usr/sbin/nologin' for service
#                               accounts.
#   - userData.sshKeys.public:  Dict of public SSH keys to install.
#
# OPTIONAL VARIABLES:
#   - debugFlag: Enable debug output
#
# WORKFLOW:
#   1. Validate exactly one of userDataPath or uName
#   2. Resolve internal _userDataPath: copied from userDataPath if
#      given, otherwise derived from uName by convention
#   3. Load user data (vault-decrypted via include_vars)
#   4. Ensure referenced groups exist
#   5. Create the user account (password omitted when pwd is empty)
#   6. Set home directory mode (skipped when createHome=false)
#   7. Install public SSH keys (if any)
#   8. Install per-user files from sibling files/ (skipped when
#      createHome=false)
#
# EXAMPLES:
#   - include_tasks: "{{ taskDir }}/users/createUser.yaml"
#     vars:
#       userDataPath: "{{ dataDir }}/users/dwfa/user.yaml"
#
#   - include_tasks: "{{ taskDir }}/users/createUser.yaml"
#     vars:
#       uName: dwfa
#
# NOTES:
#   - Requires Python passlib for password_hash('sha512')
#   - | trim applied to vault-decrypted strings (uName, pwd) to strip
#     trailing newlines that ansible-vault encrypt_string appends
#   - When pwd is empty/absent, the user module's `password` parameter
#     is omitted entirely (the account exists with no password set,
#     equivalent to '!' in /etc/shadow). Login by password is then
#     impossible; SSH key auth still works if keys are installed.
#   - _cuLoadedUser intentionally NOT cleaned up: loaded via
#     include_vars (a var, not a fact); set_fact would create a
#     blocking fact that prevents the next reload
#   - Internal `_userDataPath` is set once from the public input and
#     used everywhere downstream. The public `userDataPath` is never
#     rebound — Ansible's eager evaluation of include `vars:` makes
#     `userDataPath: "{{ ... }}"` rebindings prone to a recursive
#     templating bug
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 5.2
# Date: May 6, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Validate: exactly one of userDataPath or uName must be provided
##############################################################################
- name: Validate required input
  ansible.builtin.fail:
    msg: >-
      [ERROR] *** createUser task requires exactly one of userDataPath
      or uName to be provided
  when: >-
    ([userDataPath is defined,
      uName        is defined] | select | list | length) != 1

##############################################################################
# Resolve the internal path. Used everywhere downstream — the public
# `userDataPath` input is left untouched.
##############################################################################
- name: Resolve internal _userDataPath
  ansible.builtin.set_fact:
    _userDataPath: >-
      {{ userDataPath
         if userDataPath is defined
         else dataDir ~ '/users/' ~ uName ~ '/user.yaml' }}

##############################################################################
# Load user data
##############################################################################
- name: Load user data
  ansible.builtin.include_vars:
    file: "{{ _userDataPath }}"
    name: _cuLoadedUser

##############################################################################
# Ensure referenced groups exist. Concatenates primary + supplementary
# into one list; `| default([])` keeps the `+` safe when either is
# undefined.
##############################################################################
- name: Ensure referenced groups exist
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/group/createGroups.yaml"
  vars:
    groupList: >-
      {{ (_cuLoadedUser.userData.primaryGroup        | default([])) +
         (_cuLoadedUser.userData.supplementaryGroups | default([])) }}

##############################################################################
# Create the user account. password is omitted when pwd is empty/absent
# (the account is created locked — no password login). create_home
# defaults to true; set userData.createHome=false for service accounts.
##############################################################################
- name: "Create user account [{{ _cuLoadedUser.userData.uName | trim }}]"
  ansible.builtin.user:
    comment:         "{{ _cuLoadedUser.userData.name }}"
    create_home:     "{{ _cuLoadedUser.userData.createHome | default(true) | bool }}"
    group:           "{{ _cuLoadedUser.userData.primaryGroup[0].name }}"
    groups:          "{{ _cuLoadedUser.userData.supplementaryGroups
                          | default([])
                          | map(attribute='name')
                          | join(',') }}"
    name:            "{{ _cuLoadedUser.userData.uName | trim }}"
    password:        "{{ (_cuLoadedUser.userData.pwd | trim | password_hash('sha512'))
                          if (_cuLoadedUser.userData.pwd | default('') | trim | length > 0)
                          else omit }}"
    shell:           "{{ _cuLoadedUser.userData.shell | default('/bin/bash') }}"
    state:           present
    uid:             "{{ _cuLoadedUser.userData.uid }}"
    update_password: always

##############################################################################
# Set home directory mode (override Debian's 0700 default). Skipped when
# createHome is false — there is no home dir to mode-set.
##############################################################################
- name: "Set home directory mode for [{{ _cuLoadedUser.userData.uName | trim }}]"
  when: _cuLoadedUser.userData.createHome | default(true) | bool
  ansible.builtin.file:
    path:  "/home/{{ _cuLoadedUser.userData.uName | trim }}"
    mode:  "{{ _cuLoadedUser.userData.homeMode | default('0755') }}"
    owner: "{{ _cuLoadedUser.userData.uName | trim }}"
    group: "{{ _cuLoadedUser.userData.primaryGroup[0].name }}"
    state: directory

##############################################################################
# Install user's public SSH keys (skipped if user.yaml has none)
##############################################################################
- name: Install user's public SSH keys
  when:
    - _cuLoadedUser.userData.sshKeys             is defined
    - _cuLoadedUser.userData.sshKeys.public      is defined
    - _cuLoadedUser.userData.sshKeys.public      | length > 0
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/users/addSSHKeys.yaml"
  vars:
    uName:      "{{ _cuLoadedUser.userData.uName | trim }}"
    publicKeys: "{{ _cuLoadedUser.userData.sshKeys.public }}"

##############################################################################
# Install per-user files. Skipped when createHome is false — there is
# no home directory to install files into. Pass _userDataPath as
# userDataPath to the sub-task — single substitution, no nested
# template.
##############################################################################
- name: Install user files
  when: _cuLoadedUser.userData.createHome | default(true) | bool
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/users/installUserFiles.yaml"
  vars:
    userDataPath: "{{ _userDataPath }}"
