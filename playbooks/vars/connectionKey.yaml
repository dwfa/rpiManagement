##############################################################################
# SSH connection variables — key auth
#
# USAGE:
#   Load via vars_files in remote plays when the connecting user has SSH
#   keys materialized to disk. Selected automatically via userData.file
#   set by prepareRemoteCredentials, or loaded explicitly.
#
# PREREQUISITES:
#   - Preceding play must run prepareRemoteCredentials role on localhost
#   - userData fact must exist in hostvars['localhost']
#   - data/ssh/key.prv must exist (written by materializeSSHKey)
#
# EXAMPLE:
#   vars_files:
#     - "{{ playbook_dir }}/vars/connection\
#        {{ hostvars['localhost'].userData.file }}.yaml"
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.2
# Date: August 15, 2026
##############################################################################

---                                            # identifies a YAML config file

# Alias for cleaner references (indirection via hostvars)
userData: "{{ hostvars['localhost'].userData }}"

# SSH connection configuration
ansible_ssh_common_args:      "-o UserKnownHostsFile={{ dataPath }}/ssh/knownHosts"
ansible_ssh_private_key_file: "{{ dataPath }}/ssh/key.prv"
ansible_user:                 "{{ userData.uName }}"

# Privilege escalation configuration
ansible_become:          "{{ becomeFlag | default('true') }}"
ansible_become_password: "{{ userData.sudoPWD }}"