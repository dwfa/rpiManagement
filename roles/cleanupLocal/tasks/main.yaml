##############################################################################
# Run local cleanup tasks after all remote plays complete
#
# USAGE:
#   Run as the final role in a localhost cleanup play after all remote
#   plays have completed. Removes runtime-generated local artifacts
#   (e.g. materialized SSH keys written by materializeSSHKey).
#
# REQUIRED VARIABLES:
#   - taskDir: Path to tasks directory (from common role)
#   - dataDir: Path to data directory (from common role)
#
# EXAMPLE:
#   - name: Cleanup local artifacts
#     hosts:        localhost
#     connection:   local
#     gather_facts: false
#     roles:
#       - cleanupLocal
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.1
# Date: March 22, 2026
##############################################################################
---                                            # identifies a YAML config file

- name: Remove materialized SSH keys
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/users/cleanupSSHKey.yaml"