##############################################################################
# Set static IP — online strategy (apply to running host via NetworkManager)
#
# USAGE:
#   Internal strategy of setStaticIP.yaml. Changes the NetworkManager
#   connection active on eth0 in place (address with prefix, gateway,
#   DNS, search domain), then reboots the host so the new address and
#   every service start clean on it, and waits for SSH on the new
#   address.
#
#   Pure mechanism: this task only switches the IP and verifies the new
#   address is reachable. Project-specific conventions (updating the
#   findHostIP `discoveredRPiIP` fact, registering the new IP in runtime
#   inventory for `hosts:` matching) live in the wrapping role
#   (roles/setStaticIP), not here.
#
#   Callers should normally invoke setStaticIP.yaml (which dispatches to
#   this strategy when partitionDevice is NOT provided), not this file
#   directly.
#
# REQUIRED VARIABLES:
#   - currentAddress:   The address the target is currently reachable at.
#                       Used both for idempotency (skip if already on the
#                       desired address) and for the diagnostic message
#                       describing the switch.
#   - staticIPDataPath: Path to YAML file containing ipDetails
#                       (address, netmask, gateway, dns list, domain,
#                       and optionally hostname).
#
# OPTIONAL VARIABLES:
#   - confirmSwitch:    true asks for confirmation just before the reboot
#                       (default false)
#   - targetAddress:    Address to switch to. Overrides
#                       ipDetails.address from staticIPDataPath (the
#                       other ipDetails fields are still used). Lets the
#                       caller take the address from the inventory.
#   - debugFlag:        Enable debug output.
#
# OUTPUT FACTS:
#   - _ssipnChanged:    Set to true on localhost when the apply block
#                       actually ran (i.e., a switch was performed).
#                       Wrappers gate post-conditions on this so a
#                       no-op call doesn't trigger downstream side
#                       effects. Not set on the no-op path; readers
#                       should default it to false.
#
# WORKFLOW:
#   1. Load static IP data from staticIPDataPath
#   2. Skip block if currentAddress already equals the desired static
#      address (idempotent)
#   3. Mark _ssipnChanged=true so wrappers know the switch happened
#   4. Find the NetworkManager connection active on eth0
#   5. nmcli connection modify: write address/prefix, gateway, DNS and
#      search domain into it (saved settings only; the live address
#      does not change yet)
#   6. When ipDetails.hostname is set: set the hostname and point it
#      at the new address in /etc/hosts
#   7. When confirmSwitch: ask before rebooting; stop on anything but yes
#   8. Async reboot so the task returns before the SSH session drops
#   9. Wait from localhost for the new address's :22 to confirm the box
#      came back on it
#
# NOTES:
#   - The address is always written with its prefix from netmask; an
#     address without one becomes /32 and breaks LAN traffic.
#   - modify keeps the same connection and UUID, so no second profile
#     is created and nothing switches before the reboot.
#   - The reboot restarts every service on the new address; services
#     that bind to their start-up address (pi-hole) follow the move.
#   - The async/poll:0 reboot is essential: the SSH session dies with
#     the host and a synchronous task would hang. The leading `sleep 3`
#     lets the task's result reach the controller first.
#   - Ansible's reboot module is not used: it waits on the old address.
#   - _ssipnChanged is set on localhost (delegate_to) so the role's
#     main.yaml — which runs on the same play but reads via
#     hostvars-style scope — sees it consistently
#   - _ssipn prefix on file-scoped facts (setStaticIPOnline)
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: October 13, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Validate required parameter
##############################################################################
- name: Validate currentAddress is provided
  ansible.builtin.fail:
    msg: "[ERROR] *** currentAddress is required for setStaticIPOnline task"
  when: currentAddress is not defined

##############################################################################
# Load static IP data
##############################################################################
- name: Load static IP data
  ansible.builtin.include_vars:
    file: "{{ staticIPDataPath }}"
    name: _ssipnLoaded

##############################################################################
# Apply static IP — skip entirely if host already at the desired address
##############################################################################
- name: Apply static IP
  when: currentAddress != _ssipnAddress
  vars:
    _ssipnAddress: "{{ targetAddress | default(_ssipnLoaded.ipDetails.address) }}"
  block:

    ##########################################################################
    # Mark that a real switch is happening so wrappers can gate their
    # post-conditions on it (no-op runs leave _ssipnChanged unset).
    ##########################################################################
    - name: Mark switch as occurring
      ansible.builtin.set_fact:
        _ssipnChanged: true
      delegate_to:    localhost
      delegate_facts: true

    - name: Debug switch intent
      when: debugFlag | default(0) | int == 1
      ansible.builtin.debug:
        msg: >-
          [DEBUG] *** Switching host from
          [{{ currentAddress }}] to
          [{{ _ssipnAddress }}]

    ##########################################################################
    # Find the NetworkManager connection active on eth0
    ##########################################################################
    - name: Find the active eth0 connection
      ansible.builtin.command:
        argv: [nmcli, -g, "NAME,DEVICE", connection, show, --active]
      changed_when: false
      register: _ssipnActive

    - name: Select the eth0 connection
      ansible.builtin.set_fact:
        _ssipnConn: >-
          {{ (_ssipnActive.stdout_lines
              | select('match', '.*:eth0$')
              | map('regex_replace', ':eth0$', '')
              | first) | default('') }}

    - name: Fail if no connection is active on eth0
      ansible.builtin.fail:
        msg: "[ERROR] *** No NetworkManager connection is active on eth0"
      when: _ssipnConn | length == 0

    ##########################################################################
    # Write the static settings into that connection. modify changes the
    # saved settings only; the live address moves at the reboot below.
    ##########################################################################
    - name: Write static IP settings to the eth0 connection
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - modify
          - "{{ _ssipnConn }}"
          - ipv4.method
          - manual
          - ipv4.addresses
          - "{{ _ssipnAddress }}/{{ _ssipnLoaded.ipDetails.netmask }}"
          - ipv4.gateway
          - "{{ _ssipnLoaded.ipDetails.gateway }}"
          - ipv4.dns
          - "{{ _ssipnLoaded.ipDetails.dns | join(',') }}"
          - ipv4.dns-search
          - "{{ _ssipnLoaded.ipDetails.domain }}"
          - connection.autoconnect
          - "yes"

    ##########################################################################
    # Set the hostname when the static-IP data names one, so the name and
    # the address change together at the reboot.
    ##########################################################################
    - name: Set hostname from static IP data
      when: _ssipnLoaded.ipDetails.hostname is defined
      block:

        - name: Set hostname [{{ _ssipnLoaded.ipDetails.hostname }}]
          ansible.builtin.hostname:
            name: "{{ _ssipnLoaded.ipDetails.hostname }}"

        # The box's own address, not 127.0.1.1 (Debian's stand-in for
        # DHCP hosts): pi-hole answers from /etc/hosts, so a loopback
        # line would be handed to every LAN client asking for this name.
        - name: Point the hostname at the box's address in /etc/hosts
          ansible.builtin.lineinfile:
            path:   /etc/hosts
            regexp: "^(127\\.0\\.1\\.1|\\S+\\s+{{ (_ssipnLoaded.ipDetails.hostname ~ '.' ~ _ssipnLoaded.ipDetails.domain) | regex_escape }})\\s"
            line:   "{{ _ssipnAddress }}\t{{ _ssipnLoaded.ipDetails.hostname }}.{{ _ssipnLoaded.ipDetails.domain }} {{ _ssipnLoaded.ipDetails.hostname }}"

    ##########################################################################
    # Optional confirmation just before the reboot. The settings are saved
    # but not live; the box moves only when it reboots, so this is the
    # moment to clear the new address on the LAN.
    ##########################################################################
    - name: Confirm reboot onto the new address
      when: confirmSwitch | default(false) | bool
      block:

        - name: Ask to reboot onto [{{ _ssipnAddress }}]
          ansible.builtin.include_tasks:
            file: "{{ taskPath }}/ui/niceInput.yaml"
          vars:
            title: "Reboot onto {{ _ssipnAddress }}?"
            data: |-
              Settings for {{ _ssipnAddress }}{{ (' (' ~ _ssipnLoaded.ipDetails.hostname ~ ')') if _ssipnLoaded.ipDetails.hostname is defined else '' }} are saved on this box; it moves when it reboots.
              Make sure nothing else holds {{ _ssipnAddress }} on the LAN.
              Reboot now? [y/N]

        - name: Stop when the reboot is declined
          ansible.builtin.include_role:
            name: niceFail
          vars:
            title: "Reboot declined"
            data: |-
              The box is still on {{ currentAddress }}, but its saved settings now point at {{ _ssipnAddress }}.
              It will move at its next reboot. Re-run this playbook to finish, or
              restore the previous settings (data/network/staticIP/dnsNewTo1291.sh) before any reboot.
          when: promptValue | default('') | lower not in ['y', 'yes']

    ##########################################################################
    # Reboot so the address and every service come up clean on it.
    # async/poll:0 returns before the SSH session dies with the host.
    ##########################################################################
    - name: Reboot to apply the new address
      ansible.builtin.shell:
        cmd: sleep 3; systemctl reboot
      async: 10
      poll:  0

    ##########################################################################
    # Confirm the new IP is reachable before letting the play continue
    ##########################################################################
    - name: Wait for new static IP to be reachable
      include_tasks: "{{ taskPath }}/system/waitForHost.yaml"
      vars:
        waitHost:    "{{ _ssipnAddress }}"
        waitPort:    22
        waitTimeout: 180

    - name: Fail if new static IP not reachable
      ansible.builtin.fail:
        msg: "[ERROR] *** New static IP [{{ _ssipnAddress }}] not reachable on port 22 after reboot."
      when: not hostReachable

##############################################################################
# Cleanup temporary facts (note: _ssipnChanged is left in place — the
# wrapping role reads it after this task returns)
##############################################################################
- name: Cleanup temporary facts
  ansible.builtin.set_fact:
    _ssipnLoaded: null
    _ssipnActive: null
    _ssipnConn:   null
