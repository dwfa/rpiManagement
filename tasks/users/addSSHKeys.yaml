##############################################################################
# Install SSH public keys into one user's authorized_keys on the target
#
# USAGE:
#   Installs all public keys in publicKeys (natural user.yaml shape) into
#   ~uName/.ssh/authorized_keys on the target host. Idempotent — existing
#   keys are not duplicated.
#
# REQUIRED VARIABLES:
#   - uName:      Username whose authorized_keys file receives the keys
#   - publicKeys: Dict of {keyName: {comment, key}} — same shape as
#                 userData.sshKeys.public in user.yaml
#
# OPTIONAL VARIABLES:
#   - debugFlag: Enable debug output
#
# EXAMPLE:
#   - name: Install dwfa's SSH keys
#     include_tasks:
#       file: "{{ taskPath }}/users/addSSHKeys.yaml"
#     vars:
#       uName:      dwfa
#       publicKeys: "{{ _cuLoadedUser.userData.sshKeys.public }}"
#
# NOTES:
#   - Requires ansible.posix collection (authorized_key module)
#   - User must already exist on the target (created by createUser)
#   - Creates ~/.ssh directory if needed (authorized_key module handles)
#   - Idempotent: safe to run multiple times
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: April 19, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Validate required parameters
##############################################################################
- name: Validate uName is provided
  ansible.builtin.fail:
    msg: "[ERROR] *** uName is required for addSSHKeys task"
  when: uName is not defined

- name: Validate publicKeys is provided and non-empty
  ansible.builtin.fail:
    msg: "[ERROR] *** publicKeys is required for addSSHKeys task"
  when: publicKeys is not defined or publicKeys | length == 0

##############################################################################
# Install each public key — dict2items yields {key: <keyName>, value: <entry>}
##############################################################################
- name: "Install public keys for [{{ uName }}]"
  ansible.posix.authorized_key:
    comment: "{{ keyIdx.value.comment }}"
    key:     "{{ keyIdx.value.key }}"
    state:   present
    user:    "{{ uName }}"
  loop: "{{ publicKeys | dict2items }}"
  loop_control:
    loop_var: keyIdx
    label:    "{{ keyIdx.key }}"

- name: "Debug installed keys for [{{ uName }}]"
  ansible.builtin.debug:
    msg: >-
      [DEBUG] *** Installed [{{ publicKeys | length }}] public key(s)
      for user [{{ uName }}]:
      [{{ publicKeys.keys() | list | join(', ') }}]
  when: debugFlag | default(0) | int == 1
