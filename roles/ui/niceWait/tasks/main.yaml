##############################################################################
# Pause playbook execution and wait for the user to press Enter
#
# USAGE:
#   Thin orchestration role that renders a "press Enter to continue"
#   prompt. Wraps tasks/ui/niceWait.yaml so both role-based callers
#   and include_tasks callers share one implementation.
#
# VARIABLES:
#   - title: Optional short prompt title shown by ansibleRunner
#   - data: Optional prompt message shown by Ansible and ansibleRunner
#
# EXAMPLE:
#   roles:
#     - role: niceWait
#       vars:
#         title: "Attach storage device"
#         data: "Attach the storage device and press Enter to continue."
#
# NOTES:
#   - Must run in a play whose host has interactive stdin, typically localhost.
#   - See tasks/ui/niceWait.yaml for ansibleRunner display behavior.
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.0
# Date: August 22, 2026
##############################################################################
---                                                   # identifies a YAML file

- name: Wait for user to continue
  include_tasks:
    file: "{{ taskPath }}/ui/niceWait.yaml"
