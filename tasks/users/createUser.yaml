##############################################################################
# Create a single user account from a vault-encrypted user.yaml file
#
# USAGE:
#   Loads user credentials from a single user.yaml path, ensures all
#   referenced groups (primary + supplementary) exist on the target host,
#   and creates the user account via ansible.builtin.user. Password is
#   hashed and trimmed inline. This is the singular form — see
#   createUsers.yaml for the plural (directory-scan) wrapper.
#
# REQUIRED VARIABLES:
#   - userDataPath: Path to vault-encrypted user.yaml file containing a
#                   userData dict with: uName, uid, name, shell,
#                   primaryGroup (list with one {name, gid} entry),
#                   supplementaryGroups (list of {name, gid?} entries),
#                   pwd (vault-encrypted)
#
# OPTIONAL VARIABLES:
#   - debugFlag: Enable debug output
#
# WORKFLOW:
#   1. Validate userDataPath is provided
#   2. Load user data from userDataPath (vault decrypted via include_vars)
#   3. Ensure all referenced groups exist via createGroups.yaml (primary
#      + supplementary). Missing groups are created (with gid if provided,
#      else OS auto-assigns). Existing groups are left untouched.
#   4. Create the user account via ansible.builtin.user
#
# EXAMPLE:
#   - name: Create dwfa user
#     include_tasks:
#       file: "{{ taskDir }}/users/createUser.yaml"
#     vars:
#       userDataPath: "{{ dataDir }}/users/dwfa/user.yaml"
#
# NOTES:
#   - Requires Python passlib for password_hash('sha512') filter
#   - | trim applied to uName and pwd to strip trailing newlines that
#     ansible-vault encrypt_string appends to decrypted values
#   - _cuLoadedUser intentionally NOT cleaned up: loaded via include_vars
#     (a var, not a fact); set_fact would create a blocking fact that
#     prevents the next reload
#   - Must run in a remote play (where ansible.builtin.user executes)
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 4.0
# Date: April 19, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Validate required parameter
##############################################################################
- name: Validate userDataPath is provided
  ansible.builtin.fail:
    msg: "[ERROR] *** userDataPath is required for createUser task"
  when: userDataPath is not defined

##############################################################################
# Load user data from vault-encrypted file
##############################################################################
- name: Load user data
  ansible.builtin.include_vars:
    file: "{{ userDataPath }}"
    name: _cuLoadedUser

##############################################################################
# Ensure referenced groups exist
# Concatenate primary + supplementary groups into one list and delegate
# to createGroups.yaml (which loops and creates any that don't yet exist).
# `| default([])` — if either list is undefined, use an empty list so
# the `+` concatenation is always safe.
##############################################################################
- name: Ensure referenced groups exist
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/group/createGroups.yaml"
  vars:
    groupList: >-
      {{ (_cuLoadedUser.userData.primaryGroup        | default([])) +
         (_cuLoadedUser.userData.supplementaryGroups | default([])) }}

##############################################################################
# Create the user account
##############################################################################
- name: "Create user account [{{ _cuLoadedUser.userData.uName | trim }}]"
  ansible.builtin.user:
    comment:         "{{ _cuLoadedUser.userData.name }}"
    group:           "{{ _cuLoadedUser.userData.primaryGroup[0].name }}"
    groups:          "{{ _cuLoadedUser.userData.supplementaryGroups
                          | default([])
                          | map(attribute='name')
                          | join(',') }}"
    name:            "{{ _cuLoadedUser.userData.uName | trim }}"
    password:        "{{ _cuLoadedUser.userData.pwd
                          | default('')
                          | trim
                          | password_hash('sha512') }}"
    shell:           "{{ _cuLoadedUser.userData.shell | default('/bin/bash') }}"
    state:           present
    uid:             "{{ _cuLoadedUser.userData.uid }}"
    update_password: always

##############################################################################
# Install the user's public SSH keys (if any) — required before any later
# play can SSH in as this user using key auth. Skipped if user.yaml has
# no sshKeys.public section.
##############################################################################
- name: Install user's public SSH keys
  ansible.builtin.include_tasks:
    file: "{{ taskDir }}/users/addSSHKeys.yaml"
  vars:
    uName:      "{{ _cuLoadedUser.userData.uName | trim }}"
    publicKeys: "{{ _cuLoadedUser.userData.sshKeys.public }}"
  when:
    - _cuLoadedUser.userData.sshKeys             is defined
    - _cuLoadedUser.userData.sshKeys.public      is defined
    - _cuLoadedUser.userData.sshKeys.public      | length > 0
