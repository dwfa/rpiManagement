##############################################################################
# Configure pi-hole on a host where it's already installed
#
# USAGE:
#   include_tasks AFTER tasks/pihole/install.yaml in the playbook.
#   Re-renders setupVars.conf (so metadata changes are picked up on
#   re-runs), drops the nginx reverse-proxy snippet into nginx's
#   default-locations, then reloads pihole-FTL + nginx.
#
# REQUIRED VARIABLES:
#   None at the call site. The setupVars.conf template pulls
#   userData from hostvars['localhost'] (set by Play 1's
#   prepareRemoteCredentials role) for the WEBPASSWORD default.
#
# OPTIONAL VARIABLES:
#   - webPassword, piholeInterface, ipv4Address: see install.yaml
#   - debugFlag:                                  Enable debug output
#
# WORKFLOW:
#   1. Re-render /etc/pihole/setupVars.conf (idempotent overwrite)
#   2. Drop 01_pihole.location into nginx's default-locations
#      (available + enabled symlink)
#   3. Validate nginx config (`nginx -t`)
#   4. Restart pihole-FTL (it re-reads setupVars.conf on restart)
#   5. Reload nginx
#
# NOTES:
#   - INSTALL_WEB_SERVER=false in setupVars.conf told the installer to
#     skip lighttpd, so the admin UI is served by pi-hole-FTL's own
#     embedded HTTP server. FTL listens on 127.0.0.1:8080 per the
#     `webserver.port` setting in our pihole.toml template; nginx
#     reverse-proxies /pihole/ to it via 01_pihole.location.
#   - `pihole-FTL` restart (not reload) is required for setupVars.conf
#     and pihole.toml changes to take effect.
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.0
# Date: May 10, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Step 1: Re-render setupVars.conf + pihole.toml so on-disk config
# matches metadata. Load pi-hole metadata first so ftlWebserverPort
# is in scope for the toml template.
##############################################################################
- name: Load pi-hole metadata
  ansible.builtin.include_vars:
    file: "{{ dataPath }}/packages/pihole/metadata.yaml"

##############################################################################
# Step 1b: Derive DNS upstream from bind9's LAN listener
#
# pi-hole forwards every query to the co-located bind9 (which owns the
# dwfa.ca zone and forwards everything else to its own forwarders).
# Rather than hand-copy bind9's listen address/port into pi-hole's
# metadata (drift risk when bind9 moves), we read bind9's metadata
# here and derive dnsUpstreams from its non-loopback listenIPv4
# entries. inventory.json's metadata.network must be in scope so
# bind9's metadata references (e.g. {{ network.dnsServer }}) resolve.
##############################################################################
- name: Ensure network inventory is parsed
  ansible.builtin.include_tasks: "{{ taskPath }}/network/parseInventory.yaml"

- name: Set network fact for bind9 metadata references
  ansible.builtin.set_fact:
    network: "{{ netInventory.metadata.network }}"

- name: Load bind9 metadata (for upstream derivation)
  ansible.builtin.include_vars:
    file: "{{ dataPath }}/packages/bind9/metadata.yaml"
    name:  bindMeta

##############################################################################
# Address comes from the target's own default-route interface — the
# live LAN IP as seen at play time, which follows the box if it
# moves (staging IP today, production tomorrow). Port comes from
# bind9's non-loopback listener entry in bind9/metadata.yaml, so a
# port change in bind9 flows through here automatically. The
# loopback listener (127.0.0.2:53) is skipped — it exists for dhcpd
# DDNS only, not for pi-hole upstream traffic.
##############################################################################
- name: Derive pi-hole dnsUpstreams from bind9's LAN listener port
  ansible.builtin.set_fact:
    dnsUpstreams: >-
      {{
        dnsUpstreams | default([])
          + [ ansible_default_ipv4.address ~ '#' ~ item.port ]
      }}
  loop: "{{ bindMeta.listenIPv4 }}"
  loop_control:
    label: "port {{ item.port }}"
  when: '"127.0.0.2" not in item.addresses'

- name: Render /etc/pihole/setupVars.conf
  ansible.builtin.template:
    src:    "{{ dataPath }}/packages/pihole/setupVars.conf.j2"
    dest:   /etc/pihole/setupVars.conf
    owner:  pihole
    group:  pihole
    mode:   '0644'
    backup: true
  vars:
    userData: "{{ hostvars['localhost'].userData }}"
  register: _pcSetupVarsResult

- name: Render /etc/pihole/pihole.toml (FTL webserver port)
  ansible.builtin.template:
    src:    "{{ dataPath }}/packages/pihole/pihole.toml.j2"
    dest:   /etc/pihole/pihole.toml
    owner:  pihole
    group:  pihole
    mode:   '0644'
    backup: true
  register: _pcPiholeTomlResult

##############################################################################
# Step 2: Install the nginx reverse-proxy snippet for the admin UI
##############################################################################
- name: Drop 01_pihole.location into nginx default-locations
  ansible.builtin.copy:
    src:    "{{ dataPath }}/packages/pihole/01_pihole.location"
    dest:   /etc/nginx/sites-available/default-locations/01_pihole.location
    owner:  root
    group:  root
    mode:   '0644'
    backup: true
  register: _pcLocationResult

- name: Enable 01_pihole.location via sites-enabled symlink
  ansible.builtin.file:
    src:   /etc/nginx/sites-available/default-locations/01_pihole.location
    dest:  /etc/nginx/sites-enabled/default-locations/01_pihole.location
    owner: root
    group: root
    state: link

##############################################################################
# Step 3: Validate the nginx config before reloading
##############################################################################
- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

##############################################################################
# Step 4: Restart pihole-FTL so it picks up setupVars.conf changes
##############################################################################
- name: Restart pihole-FTL
  ansible.builtin.systemd:
    name:    pihole-FTL
    enabled: true
    state:   restarted
  when: _pcSetupVarsResult.changed or _pcPiholeTomlResult.changed

##############################################################################
# Step 5: Reload nginx so the new /pihole/ location is live
##############################################################################
- name: Reload nginx
  ansible.builtin.systemd:
    name:  nginx
    state: reloaded
  when: _pcLocationResult.changed
