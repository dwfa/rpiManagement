##############################################################################
# Materialize the internal Certificate Authority and a wildcard server cert
#
# USAGE:
#   Localhost-only role. Run in Play 1 (or any localhost play) to ensure
#   the project's internal CA exists and a current wildcard cert for
#   *.dwfa.ca (with apex dwfa.ca) is available under data/pki/.
#
#   Despite the "install" verb, this role does NOT install the CA cert
#   into any trust store — that is a one-time manual step on each admin
#   device.
#
#   Private keys (CA + wildcard) are vault-encrypted at rest in data/pki/.
#   All crypto operations are staged in a controller-side temp directory
#   so vault-encrypted source files are decrypted only into volatile
#   storage; the temp dir is removed at the end of the role even on
#   failure.
#
# REQUIRED VARIABLES:
#   None at the call site.
#
# OPTIONAL VARIABLES:
#   - debugFlag:   Enable debug output
#   - forceRenew:  Force re-issue of the wildcard cert even if not near
#                  expiry (default: false). The CA is never auto-rotated.
#
# WORKFLOW:
#   1. Ensure data/pki/ exists with restrictive perms
#   2. Create a temp staging dir for crypto operations (cleaned up at end)
#   3. Create the internal CA (key + self-signed cert) if missing
#   4. Issue or renew the *.dwfa.ca wildcard cert (renews within 30 days
#      of expiry, or always when forceRenew=true)
#
# EXAMPLE:
#   - hosts:      localhost
#     connection: local
#     roles:
#       - installInternalCA
#
# NOTES:
#   - Must run on localhost (controller writes the CA + cert files)
#   - Requires the community.crypto collection on the controller:
#       ansible-galaxy collection install community.crypto
#   - Vault password file must be configured in ansible.cfg
#     (vault_password_file = ~/.ansibleVaultPWD already set)
#   - To trust the CA on an admin device, hand-install
#     data/pki/dwfaInternalCA.crt into that device's OS / browser trust
#     store
#   - The temp staging dir is created via ansible.builtin.tempfile and
#     removed in the always: clause so it's cleaned up even if a task
#     fails mid-flight
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.0
# Date: May 7, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Step 1: Ensure data/pki/ exists with restrictive perms
##############################################################################
- name: "Ensure PKI directory exists [{{ dataDir }}/pki]"
  ansible.builtin.file:
    path:  "{{ dataDir }}/pki"
    state: directory
    mode:  '0700'

##############################################################################
# Steps 2-4: All crypto work happens inside a block so the temp staging
# dir is reliably cleaned up via always:, even on failure
##############################################################################
- name: Manage internal PKI
  block:
    ##########################################################################
    # Step 2: Create temp staging dir (decrypted key material lives here
    # only for the lifetime of this block)
    ##########################################################################
    - name: Create temporary PKI staging directory
      ansible.builtin.tempfile:
        state:  directory
        prefix: ica_
      register: _icaWorkDir

    ##########################################################################
    # Step 3: Create the internal CA (idempotent)
    ##########################################################################
    - name: Create internal CA
      ansible.builtin.include_tasks:
        file: "{{ taskDir }}/pki/createCA.yaml"

    ##########################################################################
    # Step 4: Issue / renew the wildcard server cert (idempotent)
    ##########################################################################
    - name: Issue wildcard server cert
      ansible.builtin.include_tasks:
        file: "{{ taskDir }}/pki/issueWildcardCert.yaml"

  always:
    ##########################################################################
    # Always remove the staging dir, even if a task above failed. This
    # ensures decrypted key material is not left lying around on the
    # controller after a partial failure.
    ##########################################################################
    - name: Remove temporary PKI staging directory
      ansible.builtin.file:
        path:  "{{ _icaWorkDir.path }}"
        state: absent
      when: _icaWorkDir.path is defined