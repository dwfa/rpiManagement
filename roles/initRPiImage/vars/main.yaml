##############################################################################
# Ansible role variables for initRPiImage role
#
# REQUIRED INPUT FACTS:
#   - bootMountPoint: Mount path for boot partition (set by createRPiImage role)
#
# Note: These variables reference bootMountPoint which must exist when this
#       role starts. The createRPiImage role sets this fact before this role
#       is called.
#
