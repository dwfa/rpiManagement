##############################################################################
# Post-install setup for freshly imaged RPi
#
# USAGE:
#   Configures a freshly booted RPi: creates main user, adds SSH keys,
#   removes installer user.
#
# EXAMPLE:
#   ansible-playbook --extra-vars "nodes=installer" playbooks/postInstall-pb.yaml
#
# WORKFLOW:
#   Play 1 (localhost):
#     1. getTargetHostIP: Resolve target IP (try known, prompt if
#        unreachable)
#     2. prepareRemoteCredentials: Load installer credentials for SSH
#   Play 2 (target - as installer):
#     3. createUsers: Create default user (loads own data, ensures
#        groups exist, installs SSH keys)
#   Play 3 (localhost — switch credentials):
#     4. cleanupLocal: Remove installer's materialized SSH keys
#     5. prepareRemoteCredentials: Load main user (dwfa) credentials
#   Play 4 (target - as main user):
#     6. removeUsers: Remove installer user
#   Play 5 (localhost):
#     7. cleanupLocal: Remove dwfa's materialized SSH keys
#
# NOTES:
#   - RPi must be freshly imaged with installer user configured
#   - Known static IP (e.g. 192.168.129.1) tried first; if unreachable
#     (macOS-imaged RPi without preconfigured static IP), user is
#     prompted for the DHCP-assigned address
#   - After completion, RPi has default user and installer is removed
#   - Play 3 runs cleanupLocal BEFORE prepareRemoteCredentials so the
#     new user's SSH keys do not collide with (or get wiped by) the
#     installer's keys on disk
#   - getTargetHostIP sets the localhost fact `newTarget`; Plays 2 and
#     4 reference it via `hosts: "{{ hostvars['localhost'].newTarget }}"`
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 2.2
# Date: April 19, 2026
##############################################################################
---                                                   # identifies a YAML file

##############################################################################
# Play 1: Resolve target host IP and load installer credentials (localhost)
# Note: Vault decryption works on localhost (task-level include_vars)
##############################################################################
- name: Load installer credentials and resolve target host
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: getTargetHostIP
      vars:
        targetHost: "{{ groups[nodes] | first }}"
    - role: prepareRemoteCredentials
      vars:
        userDataPath: "{{ dataDir }}/users/installer/user.yaml"

##############################################################################
# Play 2: Connect as installer, create main user (groups + SSH keys)
##############################################################################
- name: Create 1st real users
  hosts:        "{{ hostvars['localhost'].newTarget }}"
  become:       true
  gather_facts: true

# Load remote connection vars (connectionKey.yaml or connectionPWD.yaml)
  vars_files:
    - "{{ playbook_dir }}/vars/connection{{ hostvars['localhost'].userData.file }}.yaml"

  roles:
    - role: createUsers
      vars:
        userDataPath: "{{ dataDir }}/users/dwfa/user.yaml"

##############################################################################
# Play 3: Switch credentials on localhost
#   - cleanupLocal removes installer's materialized SSH keys first
#   - prepareRemoteCredentials then loads dwfa (materializes dwfa's keys)
# Role order matters: cleanup MUST precede new materialization.
##############################################################################
- name: Switch credentials (cleanup installer keys, load main user)
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: cleanupLocal
    - role: prepareRemoteCredentials
      vars:
        userDataPath: "{{ dataDir }}/users/dwfa/user.yaml"

##############################################################################
# Play 4: Connect as main user, remove installer
##############################################################################
- name: Remove installer user (as main user)
  hosts:        "{{ hostvars['localhost'].newTarget }}"
  become:       true
  gather_facts: true

# Load remote connection vars (connectionKey.yaml or connectionPWD.yaml)
  vars_files:
    - "{{ playbook_dir }}/vars/connection{{ hostvars['localhost'].userData.file }}.yaml"

  roles:
    - role: removeUsers
      vars:
        userDataPath: "{{ dataDir }}/users/installer/user.yaml"

##############################################################################
# Play 5: Final cleanup of materialized SSH keys
##############################################################################
- name: Cleanup materialized SSH keys
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: cleanupLocal