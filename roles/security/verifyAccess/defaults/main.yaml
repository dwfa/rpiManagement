---                                            # identifies a YAML config file

# SSH port checked and logged in to
verifyAccessPort: 22

# Seconds to wait for the SSH port and for the test login
verifyAccessTimeout: 10

# Directory the test key is written to; removed when the role finishes
verifyAccessKeyPath: "{{ dataPath }}/ssh/verifyAccess"
