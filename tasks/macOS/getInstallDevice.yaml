##############################################################################
# macOS implementation for device detection
#
# This is the macOS-specific implementation called by getInstallDevice role.
# See roles/getInstallDevice/tasks/main.yaml for role documentation.
#
# IMPLEMENTATION:
#   Uses /usr/sbin/diskutil to compare device lists before/after attachment
#   Sets installDevice fact with detected device path (/dev/diskN)
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 1.3
# Date: October 16, 2025
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Validate platform compatibility
##############################################################################
- name: Fail if not running on macOS
  fail:
    msg: "[ERROR] *** This task requires macOS but running on [{{ ansible_system }}]"
  when: ansible_system != 'Darwin'

##############################################################################
# Capture the states of external devices initial and after prompt
##############################################################################
- name: Get set of initial external devices
  shell:
    cmd: /usr/sbin/diskutil list external
  register: _initialExternalDevices

- name: Ask and wait for new device to be attached
  include_tasks:
    file: "{{ taskDir }}/misc/waitForInput.yaml"
  vars:
    waitMsg: "Attach external device & press enter to continue ..."

- name: Get current block devices
  shell:
    cmd: /usr/sbin/diskutil list external
  register: _currentExternalDevices

##############################################################################
# Detect newly attached device and set installDevice fact
# Uses block-scoped vars to compute intermediate values without global pollution
##############################################################################
- name: Detect and set installation device
  block:
    - name: Determine install device
      set_fact:
        installDevice: "{{ _newDevices[0] | regex_replace('^(/dev/disk\\d+).*$', '\\1') }}"
      when: _newDevices | length > 0

    - name: Display device detection result
      debug:
        msg: >-
          {{ '[DEBUG] *** new attached device found [' + installDevice + ']'
               if installDevice is defined else
             '[DEBUG] *** no new attached device found!!!' }}
      when: debugFlag is defined
  vars:
    _initialDevices: "{{ _initialExternalDevices.stdout_lines | select('match', '/dev') | list }}"
    _currentDevices: "{{ _currentExternalDevices.stdout_lines | select('match', '/dev') | list }}"
    _newDevices: "{{ _currentDevices | difference(_initialDevices) }}"
