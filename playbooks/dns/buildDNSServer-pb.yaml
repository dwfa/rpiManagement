##############################################################################
# Build the DNS / DHCP server
#
# USAGE:
#   Run once on an RPi that initRPi-pb.yaml has already set up. Installs
#   and configures bind9, isc-dhcp-server, nginx, webmin, pi-hole, nut
#   and uctLCD.
#
# OPTIONAL VARIABLES:
#   - nodes: Inventory host to build (default: dnsInstaller)
#
# EXAMPLE:
#   ansible-playbook playbooks/dns/buildDNSServer-pb.yaml
#
# WORKFLOW:
#   1. Playbook Initialization (localhost): bootstrap, write builder key
#   2. Verify prerequisites (localhost): wildcard cert, TSIG key
#   3. Build DNS server (dnsInstaller, as the builder user)
#   4. Remove SSH key files (localhost)
#
# NOTES:
#   - Run playbooks/managePKI-pb.yaml first -- it creates the wildcard
#     cert and TSIG key that Play 2 checks for
#   - See each play's banner for details
#
# Copyright 2026 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 4.0
# Date: October 3, 2026
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Play 1: This is the Playbook Initialization play which runs on the localhost
# It will do the following:
#   1. bootstrap: Ensure required ansible and python packages are installed
#   2. writeSSHKey: Write the builder user's SSH key to data/ssh
##############################################################################
- name: Playbook Initialization
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: bootstrap
    - role: writeSSHKey
      vars:
        userDataPath: "{{ dataPath }}/users/{{ builderUser }}/user.yaml"

##############################################################################
# Play 2: This play verifies the DNS server's prerequisites and runs on the
# localhost
# It will do the following:
#   1. verifyWildcardCert: Fail if the wildcard cert is not in data/pki
#   2. verifyTSIGKey: Fail if the DDNS TSIG key is not in data
##############################################################################
- name: Verify prerequisites
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - role: verifyWildcardCert
    - role: verifyTSIGKey

##############################################################################
# Play 3: This play builds the DNS / DHCP server and runs on the new RPi
# (dnsInstaller, as the builder user)
# It will do the following:
#   1. createUsers: Create the DNS server's users (dnsUsers)
#   2. configureBaseRPi: Set TZ, locale, keyboard, Wi-Fi country, console
#      video, GPU memory, EEPROM BOOT_ORDER
#   3. installFish: Install fish
#   4. installVim: Install vim and its system-wide config
#   5. installUctLCD: Install the UCTRONICS status LCD daemon
#   6. installProxy: Install nginx as the HTTPS front door for webmin and
#      pi-hole
#   7. installDNSServer: Install and configure bind9 and pi-hole
#   8. installDHCPdServer: Install and configure isc-dhcp-server (DDNS
#      updates to bind9)
#   9. installNUT: Install and configure NUT as the UPS server (UPS
#      attached by USB)
#  10. installWebMin: Add Webmin's apt repository, install and configure
#      Webmin behind nginx at /admin (last, so it sees every service)
# Note: installProxy must run before webmin and pi-hole -- both add their
#       nginx location files to it
##############################################################################
- name: Build DNS server
  hosts:        "{{ nodes | default('dnsInstaller') }}"
  become:       true
  gather_facts: true

  # Builder user's credentials + connection settings (key or password).
  # dnsUsers comes from data/group_vars/dns.yaml
  vars_files:
    - "{{ dataPath }}/users/{{ builderUser }}/user.yaml"
    - "{{ pbPath }}/vars/connection.yaml"

  roles:
    - role: createUsers
      vars:
        userNames: "{{ dnsUsers }}"
    - role: configureBaseRPi
    - role: installFish
    - role: installVim
    - role: installUctLCD
    - role: installProxy
    - role: installDNSServer
    - role: installDHCPdServer
    - role: installNUT
      vars:
        nutRole: server
                                    # webmin installed LAST so it activates
    - role: installWebMin           # modules for installed pkgs

##############################################################################
# Play 4: This play removes the SSH key files and runs on the localhost
# It will do the following:
#   1. clearLocal: Remove the builder user's SSH key files from data/ssh
##############################################################################
- name: Remove SSH key files
  hosts:        localhost
  connection:   local
  gather_facts: false

  roles:
    - clearLocal