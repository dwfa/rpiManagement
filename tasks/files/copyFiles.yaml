##############################################################################
# Ansible task to copy files from source to destination based on metadata
#
# USAGE:
#   Generic task to copy files from a source directory to a destination directory.
#   Files to copy are defined in a metadata YAML file with an 'initFiles' structure.
#   Caller is responsible for mounting/unmounting if needed.
#
# REQUIRED VARIABLES:
#   - sourceDir: Source directory path containing files to copy
#   - destDir: Destination directory path where files should be copied
#   - metadataFile: Path to metadata YAML file defining files to copy
#   - debugFlag: (optional) Enable debug output
#
# WORKFLOW:
#   1. Load file configuration from metadataFile
#   2. Copy each file from sourceDir to destDir
#   3. Display copy status (debug mode only)
#   4. Cleanup temporary variables
#
# EXAMPLE:
#   - name: Copy RPi init files to mounted boot partition
#     include_tasks:
#       file: "{{ taskDir }}/files/copyFiles.yaml"
#     vars:
#       sourceDir: "{{ dataDir }}/rpi"
#       destDir: "/Volumes/boot"
#       metadataFile: "{{ dataDir }}/rpi/metadata.yaml"
#
# NOTES:
#   - Metadata file must contain 'initFiles' dictionary with file definitions
#   - Example metadata structure: initFiles.item_1.file: "filename"
#   - Caller must ensure destDir is accessible (mounted if needed)
#   - Requires write permissions to destDir
#   - Generic: can copy from any source to any destination with any metadata
#
# Copyright 2025 Douglas WF Acheson (dwfa@dwfa.ca)
# Licensed under Apache License 2.0. See LICENSE.md for details.
#
# Version: 4.1
# Date: October 25, 2025
##############################################################################
---                                            # identifies a YAML config file

##############################################################################
# Load file configuration from metadata
##############################################################################
- name: Load file configuration from metadata
  include_vars:
    file: "{{ metadataFile }}"

##############################################################################
# Copy files from source to destination
##############################################################################
- name: Copy files from source to destination
  ansible.builtin.copy:
    dest: "{{ destDir }}/{{ initFiles[item].file }}"
    src: "{{ sourceDir }}/{{ initFiles[item].file }}"
    mode: 0644
  with_items: "{{ initFiles.keys() | list }}"
  register: _cifResult

- name: Display copy status
  debug:
    msg: >-
      {{ '[DEBUG] *** Copied [' + (_cifResult.results | length | string) + '] files from [' + sourceDir + '] to [' + destDir + ']'
           if _cifResult is succeeded else
         '[DEBUG] *** Failed to copy files' }}
  when: debugFlag is defined

##############################################################################
# Cleanup temporary facts (register variables)
##############################################################################
- name: Cleanup temporary facts
  set_fact:
    _cifResult: null
